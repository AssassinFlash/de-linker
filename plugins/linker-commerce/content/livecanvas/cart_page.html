<section class="woocommerce">
	<div id="container-content-cart" class="mx-auto max-w-[1160px] px-4 py-10">
		<div id="tv-storefront-cart" class="rounded-xl bg-white">
			[lc_if condition="linker_commerce_draft_empty"]
				<div class="woocommerce">
					<div class="woocommerce-notices-wrapper">[lc_wc_notices]</div>
					[linker_draft_empty]
				</div>
			[/lc_if]
			[lc_if condition="linker_commerce_draft_filled"]
				<p id="linker-draft-pending" class="linker-inquiry-draft-notice" data-inquiry-draft-pending role="status" tabindex="-1" hidden>[linker_inquiry_text key="update-before-send"]</p>
				[woocommerce_cart]
			[/lc_if]
		</div>
	</div>
</section>
