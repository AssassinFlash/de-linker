<div>
	[lc_wc_notices]
</div>

<div id="linker-products" class="sf-products">
	[linker_products_head]

	[linker_products_actions]

	<section class="product-section">
		<div class="container product-layout">
			<aside class="sidebar-filters" id="sidebar-filters" data-linker-product-filter aria-label="Product filters">
				[linker_products_filters]
			</aside>

			<div class="product-results">
				<div class="wb-strip">
					<div class="wbc">[linker_products_chips]</div>
					<span class="wbcount">[linker_products_family_count]</span>
					[linker_products_sort]
				</div>

				[linker_products_empty]

				<div class="product-grid" id="product-grid">
					[linker_products_families]
				</div>

				<div class="wb-pages">[linker_products_family_pagination]</div>

				[linker_products_contact]
			</div>
		</div>
	</section>
</div>
