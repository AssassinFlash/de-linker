<div>
	[lc_wc_notices]
</div>

<div id="tv-woo-b2b-catalog" class="sf-catalog">
	[linker_catalog_head]

	<nav class="catalog-mobile-actions" aria-label="Catalog tools">
		<button type="button" id="catalog-filter-open" aria-controls="sidebar-filters" aria-expanded="false"><span>Filters</span></button>
		[linker_genie_chips page_type="category"]
	</nav>

	<section class="catalog-section">
		<div class="container catalog-layout">
			<aside class="sidebar-filters" id="sidebar-filters" data-linker-catalog-filter aria-label="Product filters">
				[linker_catalog_filters]
			</aside>

			<div class="catalog-results">
				<div class="wb-strip">
					<div class="wbc"></div>
					<span class="wbcount">[lc_wc_result_count]</span>
					[linker_catalog_sort]
				</div>

				[linker_catalog_empty]

				<div class="catalog-grid" id="catalog-grid">
					[lc_loop]
					[linker_catalog_card]
					[/lc_loop]
				</div>

				<div class="wb-pages">[lc_the_pagination class="wb-page-links"]</div>
			</div>
		</div>
	</section>
</div>
