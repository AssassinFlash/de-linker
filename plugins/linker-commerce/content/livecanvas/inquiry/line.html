<div class="linker-inquiry-line cart_item"><a class="linker-inquiry-product" href="{{url}}"><span class="linker-inquiry-image">{{image}}</span><span>{{name}}</span></a><label class="linker-inquiry-quantity"><span>{{quantity-label}}</span><input class="qty" type="number" name="cart[{{key}}][qty]" value="{{quantity}}" min="0" step="1" aria-label="{{label}}" /></label><div class="linker-inquiry-price">{{price}}</div><div class="product-remove"><a class="linker-inquiry-remove" href="{{remove-url}}" aria-label="{{remove-description}}" role="button"><span aria-hidden="true">×</span><span>{{remove}}</span></a></div></div>
