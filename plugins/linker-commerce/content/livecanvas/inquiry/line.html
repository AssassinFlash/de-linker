<div class="linker-inquiry-line"><a class="linker-inquiry-product" href="{{url}}"><span class="linker-inquiry-image">{{image}}</span><span>{{name}}</span></a><label class="linker-inquiry-quantity"><span>{{quantity-label}}</span><input type="number" name="cart[{{key}}][qty]" value="{{quantity}}" min="0" step="1" aria-label="{{label}}" /></label><div class="linker-inquiry-price">{{price}}</div></div>
