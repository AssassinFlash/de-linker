<div class="linker-inquiry-line cart_item">
	<a class="linker-inquiry-product" href="{{url}}">
		<span class="linker-inquiry-image">{{image}}</span>
		<span class="linker-inquiry-identity"><strong>{{name}}</strong><small class="linker-inquiry-sku" title="{{sku}}">{{sku}}</small></span>
	</a>
	<div class="linker-inquiry-line-controls">
		<span class="linker-inquiry-stock" data-stock="{{stock-state}}">{{availability}}</span>
		<div class="linker-inquiry-stepper">
			<button type="button" hidden data-quantity-step="-1" aria-label="{{decrease}}">−</button>
			<input class="qty" type="number" name="cart[{{key}}][qty]" value="{{quantity}}" min="0" step="1" aria-label="{{label}}" />
			<button type="button" hidden data-quantity-step="1" aria-label="{{increase}}">+</button>
		</div>
	</div>
	<div class="linker-inquiry-line-meta"><div class="linker-inquiry-price">{{price}}</div><div class="product-remove"><a class="linker-inquiry-remove" href="{{remove-url}}" aria-label="{{remove-description}}" role="button">{{remove}}</a></div></div>
</div>
