<section class="linker-gate linker-account-status" aria-label="{{label}}">
	<span class="linker-gate-badge is-{{status}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.6V12l3.2 2"/></svg><span>{{badge}}</span></span>
	<h2>{{title}}</h2>
	<div class="linker-gate-body"><p>{{message}}</p>{{reason}}<p>{{contact}}</p></div>
	<div class="linker-gate-actions"><a class="linker-gate-btn is-primary" href="{{products}}">{{browse}}</a></div>
</section>
