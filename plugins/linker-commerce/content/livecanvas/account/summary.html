<section class="linker-account-card linker-account-summary">
	<ol class="linker-account-stagebar" aria-label="[linker_account_text key='status']">[linker_account_rows type="stages"]</ol>
	<div class="linker-account-card-body">
		<dl class="linker-account-card-meta">
			<div><dt>[linker_account_text key="number"]</dt><dd>#[linker_account_field key="number"]</dd></div>
			<div><dt>[linker_account_text key="date"]</dt><dd>[linker_account_field key="date"]</dd></div>
			<div><dt>[linker_account_text key="amount"]</dt><dd>[linker_account_field key="total"]</dd></div>
		</dl>
		<div class="linker-account-actions">[linker_account_rows type="actions"]</div>
	</div>
</section>
