<section class="linker-account-panel" aria-labelledby="linker-account-recent">
	<header class="linker-account-panel-heading">
		<h2 id="linker-account-recent">[linker_account_text key="recent"]</h2>
		<a href="[linker_account_url endpoint='orders']">[linker_account_text key="view-all"]</a>
	</header>
	<div class="linker-account-rows">
		<div class="linker-account-rows-head" aria-hidden="true"><span>[linker_account_text key="number"]</span><span>[linker_account_text key="status"]</span><span>[linker_account_text key="date"]</span><span>[linker_account_text key="amount"]</span></div>
		[linker_account_field key="rows"]
	</div>
</section>
