[linker_account_hook name="before-orders"]
<div class="linker-account-inquiry-block">
	<nav class="linker-account-tabs" aria-label="[linker_account_text key='inquiries']">
		<a href="[linker_account_url endpoint='orders']" aria-current="[linker_account_field key='all-current']">[linker_account_text key="all"]</a>
		<a href="[linker_account_field key='open-url']" aria-current="[linker_account_field key='open-current']">[linker_account_text key="open"]</a>
	</nav>
	<section class="linker-account-panel linker-account-inquiry-panel">
		<ul class="linker-account-rows linker-account-inquiry-list">[linker_account_rows type="inquiries"]</ul>
		[linker_account_hook name="pagination"]
		<nav class="linker-account-pagination" aria-label="[linker_account_text key='inquiries']">[linker_account_rows type="pagination"]</nav>
	</section>
</div>
[linker_account_hook name="after-orders"]
