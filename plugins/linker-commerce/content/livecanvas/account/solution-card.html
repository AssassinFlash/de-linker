<article id="linker-solution-[linker_account_field key='id']" class="linker-account-card">
	<header class="linker-account-solution-meta"><h2>[linker_account_field key="title"]</h2><p>[linker_account_text key="saved"] · [linker_account_field key="date"]</p></header>
	<div class="linker-account-card-body">
		<ul class="linker-account-products">[linker_account_field key="items"]</ul>
		<div class="linker-account-actions">
			<form method="post">[linker_account_field key="nonce"]<button name="linker_solution_to_draft" value="[linker_account_field key='id']" type="submit">[linker_account_text key="add"]</button></form>
			[linker_account_rows type="report"]
		</div>
	</div>
</article>
