<section class="linker-account-panel" aria-labelledby="linker-account-documents">
	<header class="linker-account-panel-heading">
		<h2 id="linker-account-documents">[linker_account_text key="documents"]</h2>
		<a href="[linker_account_url endpoint='documents']">[linker_account_text key="view-all"]</a>
	</header>
	<div class="linker-account-table-wrap">
		<table class="linker-account-table">
			<thead><tr><th scope="col">[linker_account_text key="document"]</th><th scope="col">[linker_account_text key="date"]</th><th scope="col">[linker_account_text key="download"]</th></tr></thead>
			<tbody>[linker_account_field key="rows"]</tbody>
		</table>
	</div>
</section>
