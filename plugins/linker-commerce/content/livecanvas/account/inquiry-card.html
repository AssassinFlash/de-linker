<li class="linker-account-row linker-account-inquiry" data-inquiry="[linker_account_field key='id']">
	<div class="linker-account-row-main">
		<a class="linker-account-row-number" href="[linker_account_field key='url']" aria-label="[linker_account_field key='view-aria']">#[linker_account_field key="number"]</a>
		<span class="linker-account-row-sub linker-account-row-count">[linker_account_field key="items-summary"]</span>
	</div>
	<span class="linker-account-pill" data-status="[linker_account_field key='status-slug']"><span class="linker-account-pill-dot" aria-hidden="true"></span>[linker_account_field key="status"]</span>
	<span class="linker-account-row-sub linker-account-row-date">[linker_account_field key="date"]</span>
	<span class="linker-account-row-amount"><span class="sr-only">[linker_account_field key="amount-label"]</span>[linker_account_field key="total"]</span>
	<a class="linker-account-row-view" href="[linker_account_field key='url']">[linker_account_text key="view"]<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
</li>
