<tr class="linker-account-card" data-inquiry="[linker_account_field key='id']">
	<td class="linker-account-cell-inquiry">
		<a class="linker-account-cell-number" href="[linker_account_field key='url']">#[linker_account_field key="number"]</a>
		<ul class="linker-account-products">[linker_account_field key="items"]</ul>
	</td>
	<td class="linker-account-cell-status"><span class="linker-account-row-status" data-status="[linker_account_field key='status-slug']">[linker_account_field key="status"]</span></td>
	<td class="linker-account-cell-date">[linker_account_field key="date"]</td>
	<td class="linker-account-cell-amount">[linker_account_field key="total"]</td>
	<td class="linker-account-cell-actions"><div class="linker-account-actions">[linker_account_rows type="actions"]</div></td>
</tr>
