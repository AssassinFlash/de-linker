<div>
	[lc_wc_notices]
</div>

<div id="tv-storefront-pdp" class="sf-pdp [linker_pdp_brand_class]">
	<div class="sf-container">
		[linker_pdp_crumbs]

		<div class="pdp-layout">
			[linker_pdp_gallery]

			<aside class="pdp-purchase">
				<div class="pdp-buy-inner">
					[linker_pdp_buy]
				</div>
			</aside>

			<div class="pdp-content">
				<nav id="product-sections" class="pdp-section-nav" aria-label="Product sections">
					<a class="pdp-section-link" href="#description">Description</a>
					<a class="pdp-section-link" href="#stats">Technical data</a>
					<a class="pdp-section-link" href="#downloads">Documents</a>
				</nav>

				<section id="description" class="pdp-block">
					[linker_pdp_description]
				</section>

				[linker_pdp_disclosures]

				<section id="stats" class="pdp-block">
					<h2 class="pdp-section-title">Technical data</h2>
					[linker_pdp_specs]
				</section>

				[linker_pdp_scenes]

				<section id="downloads" class="pdp-block">
					<h2 class="pdp-section-title">Documents</h2>
					[linker_pdp_downloads]
				</section>

				[linker_faqs]

				[linker_pdp_pairings]
			</div>
		</div>
	</div>

	<dialog id="pdp-image-viewer" aria-label="Product image">
		<button class="pdp-viewer-close" type="button" data-pdp-viewer-close aria-label="Close image viewer">&times;</button>
		<img class="pdp-viewer-img" src="" alt="" />
	</dialog>
</div>
