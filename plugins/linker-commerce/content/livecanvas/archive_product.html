<div>
	[lc_wc_notices]
</div>

<div id="tv-woo-b2b-catalog" class="sf-catalog">
	[linker_catalog_head]

		<nav class="catalog-mobile-actions" aria-label="Product tools">
		<button type="button" id="catalog-filter-open" aria-controls="sidebar-filters" aria-expanded="false"><span>Filters</span> &middot; <span data-linker-applied-filter-count>0</span></button>
		[linker_genie_chips page_type="category"]
	</nav>

	<section class="catalog-section">
		<div class="container catalog-layout">
			<aside class="sidebar-filters" id="sidebar-filters" data-linker-catalog-filter aria-label="Product filters">
				[linker_catalog_filters]
			</aside>

			<div class="catalog-results">
				<div class="wb-strip">
					<div class="wbc"></div>
					<span class="wbcount">[linker_catalog_family_count]</span>
					[linker_catalog_sort]
				</div>

				[linker_catalog_empty]

				<div class="catalog-grid" id="catalog-grid">
					[linker_catalog_families]
				</div>

				<div class="wb-pages">[linker_catalog_family_pagination]</div>

				[linker_catalog_contact]
			</div>
		</div>
	</section>
</div>
