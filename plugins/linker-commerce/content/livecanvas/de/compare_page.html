<section class="sf-compare">
	<div id="container-content-compare" class="sf-container">
		<nav aria-label="breadcrumb" class="sf-compare-crumbs">
			<ol>
				<li><a href="[lc_home_url]">Startseite</a></li>
				<li aria-current="page"><span aria-hidden="true">/</span> [lc_the_title]</li>
			</ol>
		</nav>
		<header class="sf-compare-head">
			<div>
				<h1>[lc_the_title]</h1>
				<p class="sf-compare-note">Setzen Sie beim Durchsuchen der Produkte Häkchen bei bis zu vier Produkten und öffnen Sie diese Seite, um Kennzahlen und technische Daten nebeneinander zu sehen. Ihre Auswahl bleibt in diesem Browser-Tab.</p>
			</div>
			<a class="sf-compare-btn sf-compare-btn--ghost" href="[lc_wc_get_page_url]">Weiter einkaufen</a>
		</header>
		<div class="lc-block">[linker_compare_table]</div>
	</div>
</section>
