<section class="py-12">
	<div id="container-content-compare" class="mx-auto max-w-[1160px] px-4">
		<nav aria-label="breadcrumb" class="lc-block mb-6">
			<ol class="flex flex-wrap gap-2 text-sm">
				<li><a class="text-[#15352f] no-underline" href="[linker_site_url]">Home</a></li>
				<li aria-current="page">[lc_the_title]</li>
			</ol>
		</nav>
		<div class="lc-block">
			<h1 class="max-w-4xl text-4xl font-bold tracking-tight text-[#15352f]">[lc_the_title]</h1>
		</div>
		<div class="lc-block mt-4 max-w-3xl leading-relaxed text-neutral-600">
			<p>Tick up to four products while you browse, then open this page to see their figures and technical data side by side. Your selection stays in this browser tab.</p>
		</div>
		<div class="lc-block mt-8">
			[linker_compare_table]
		</div>
		<div class="lc-block mt-10">
			<a class="inline-flex min-h-11 items-center rounded-lg border border-(--proto-accent) px-4 font-bold text-(--proto-accent)" href="[lc_wc_get_page_url]">Continue browsing</a>
		</div>
	</div>
</section>
