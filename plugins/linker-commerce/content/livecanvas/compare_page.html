<section class="sf-compare">
	<div id="container-content-compare" class="sf-container">
		<nav aria-label="breadcrumb" class="sf-compare-crumbs">
			<ol>
				<li><a href="[lc_home_url]">Home</a></li>
				<li aria-current="page"><span aria-hidden="true">/</span> [lc_the_title]</li>
			</ol>
		</nav>
		<header class="sf-compare-head">
			<div>
				<h1>[lc_the_title]</h1>
				<p class="sf-compare-note">Tick up to four products while you browse, then open this page to see their figures and technical data side by side. Your selection stays in this browser tab.</p>
			</div>
			<a class="sf-compare-btn sf-compare-btn--ghost" href="[lc_wc_get_page_url]">Continue browsing</a>
		</header>
		<div class="lc-block">[linker_compare_table]</div>
	</div>
</section>
