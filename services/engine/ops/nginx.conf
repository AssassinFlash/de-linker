# Dedicated Linker instance: never install as the shared /etc/nginx/nginx.conf.
user www-data;
worker_processes auto;
pid /run/linker-engine-tls/nginx.pid;
lock_file /run/linker-engine-tls/nginx.lock;
error_log stderr warn;

events {}

http {
    access_log off;
    client_body_temp_path /run/linker-engine-tls/client;
    proxy_temp_path /run/linker-engine-tls/proxy;
    fastcgi_temp_path /run/linker-engine-tls/fastcgi;
    uwsgi_temp_path /run/linker-engine-tls/uwsgi;
    scgi_temp_path /run/linker-engine-tls/scgi;

    server {
        listen 8443 ssl;
        server_name 72.62.97.95;
        ssl_certificate /etc/linker-engine/engine.crt;
        ssl_certificate_key /etc/linker-engine/engine.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Match engine Gate's existing 6MiB parse cap (spec 521).
        client_max_body_size 6m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Forward headers without first spooling attacker bodies to disk.
        # HTTP/1.1 also streams chunked requests to the native bounded Gate.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location / {
            proxy_pass http://127.0.0.1:8901;
        }

        location /genie/ {
            # MAX_REQUEST_BYTES allows 20MiB files plus JSON/base64 headroom.
            # Match the existing WordPress raw cap (30MiB), below the service
            # schema-derived headroom cap; the former 4m rejected valid files.
            client_max_body_size 30m;
            proxy_pass http://127.0.0.1:8902/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
