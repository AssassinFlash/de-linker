# Dedicated Linker instance: never install as the shared /etc/nginx/nginx.conf.
user www-data;
worker_processes auto;
pid /run/linker-engine-tls/nginx.pid;
lock_file /run/linker-engine-tls/nginx.lock;
error_log stderr warn;

events {}

http {
    # Fixed categories only: never log a raw URI, query, IP, header or body.
    map $uri $linker_route {
        default other;
        /health engine_health;
        /resource/version engine_version;
        ~^/geo/plz/[^/]+$ engine_postcode;
        /design/residential engine_residential;
        /design/commercial engine_commercial;
        /roof/outline engine_roof_outline;
        /roof/pack engine_roof_pack;
        /report/pdf engine_report_pdf;
        /genie/health genie_health;
        /genie/budget/take genie_budget;
        /genie/turn genie_turn;
        /genie/assistant/turn genie_turn;
        ~^/genie/(assistant/)?turn/[^/]+/vote$ genie_vote;
        /genie/summary genie_summary;
        ~^/genie/assistant/conversation/[^/]+/forget$ genie_forget;
        /genie/pages/invalidate genie_invalidate;
        /genie/inquiries/assess inquiry_assessment;
    }
    map $request_method $linker_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        OPTIONS OPTIONS;
    }
    log_format linker_access escape=json
        '{"schema":"linker_tls_access_v1","route":"$linker_route",'
        '"method":"$linker_method","status":$status,"duration_s":$request_time,'
        '"request_bytes":$request_length,"sent_bytes":$bytes_sent,'
        '"request_id":"$request_id"}';
    # Native syslog reaches the existing bounded journal without reopening its
    # stderr AF_UNIX stream. Existing private error diagnostics remain separate.
    access_log syslog:server=unix:/dev/log,facility=local6,tag=linker_tls_access,severity=info,nohostname linker_access;
    client_body_temp_path /run/linker-engine-tls/client;
    proxy_temp_path /run/linker-engine-tls/proxy;
    fastcgi_temp_path /run/linker-engine-tls/fastcgi;
    uwsgi_temp_path /run/linker-engine-tls/uwsgi;
    scgi_temp_path /run/linker-engine-tls/scgi;

    server {
        listen 8443 ssl;
        server_name 72.62.97.95;
        ssl_certificate /etc/linker-engine/engine.crt;
        ssl_certificate_key /etc/linker-engine/engine.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Match engine Gate's existing 6MiB parse cap (spec 521).
        client_max_body_size 6m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Forward headers without first spooling attacker bodies to disk.
        # HTTP/1.1 also streams chunked requests to the native bounded Gate.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Correlation is generated here, never accepted from a client header.
        proxy_set_header X-Linker-Request-ID $request_id;
        add_header X-Linker-Request-ID $request_id always;

        location / {
            proxy_pass http://127.0.0.1:8901;
        }

        location ~ ^/planning(?:/|$) {
            # Explicit planner transport policy (548-service-hosting), separate
            # from legacy sizing. The private app enforces the configured cap.
            client_max_body_size 16m;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header X-Content-Type-Options;
            add_header Cache-Control "no-store, private" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://127.0.0.1:8901;
        }

        location /genie/ {
            # MAX_REQUEST_BYTES allows 20MiB files plus JSON/base64 headroom.
            # Match the existing WordPress raw cap (30MiB), below the service
            # schema-derived headroom cap; the former 4m rejected valid files.
            client_max_body_size 30m;
            proxy_pass http://127.0.0.1:8902/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
