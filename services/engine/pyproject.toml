[project]
name = "linker-engine"
version = "0.1.0"
description = "Sizing engine of the Solution Configurator."
# The VPS runs Python 3.12 (docs/research/2026-10-09/framework-choice.md §7).
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "jsonschema>=4.23",
    "pvlib>=0.13",
    "pyproj>=3.7",
    "python-multipart>=0.0.20",
    "reportlab>=4.4",
    "requests>=2.32",
    "shapely>=2.1",
    "urllib3>=2.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pypdf>=6",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
    "types-reportlab>=5.0.0.20261008",
    "types-requests>=2.33.0.20261006",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
# Range written by `uv init --package` with uv 0.10.11.
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting, bugbear and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
# Pydantic's plugin reads field aliases (`yield` is a Python keyword, so the
# response field is `yield_` with the alias "yield").
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pvlib ships neither type hints nor a py.typed marker (0.16.1).
module = ["pvlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A deprecation is fixed when it appears, not when the API is removed.
filterwarnings = ["error"]
