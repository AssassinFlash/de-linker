<!DOCTYPE html>
<html lang="en" id="html-root">

<meta charset="utf-8">

<link rel="stylesheet" href="assets/app.css">
<style>
  /* Local to workspace-overview.html: app.css has no content stack for .ws
     (the grid's columns are the sidebar and a single second child, so the
     column's own sections need their stack), no colours for the tile dots,
     no meta line inside a row, no text-only panel body, no download text
     button and no contact line. Everything else comes from app.css. */
  .ov-main { display: grid; gap: 20px; align-content: start; }

  /* app.css lays .row out as one flex line. Measured in Plus Jakarta Sans 600:
     "Proformarechnung ausgestellt" is 221px at 12.5px, and at 390px the row
     leaves only 220px beside the amount — the pill would shrink and wrap its
     own text. The grid gives the status line the full row width; the meta line
     wraps inside itself when the date no longer fits beside the pill. */
  .ov-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; row-gap: 7px; align-items: center; }
  .ov-row .r-main { display: contents; }
  .ov-row .r-title { grid-area: 1 / 1; }
  .ov-row .r-end { grid-area: 1 / 2; }
  .ov-row .ov-meta { grid-area: 2 / 1 / 3 / 3; }
  .ov-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .ov-meta .r-sub { margin-top: 0; }
  .ov-amount { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .ov-row:hover .r-title { color: var(--teal-700); }
  /* .tile (a lift) and .row (no underline) already state their own hover in
     app.css; the generic a:hover underline would land on top of both */
  .ov-tile:hover, .ov-row:hover { text-decoration: none; }
  .ov-tile:focus-visible, .ov-row:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 3px; }

  /* the document titles are 287px (EN) and 321px (DE) at 15px/600, so below
     560px the button drops to its own line instead of squeezing the title */
  @media (max-width: 560px) {
    .ov-doc-row { flex-wrap: wrap; row-gap: 2px; }
    .ov-doc-row .r-main { flex: 1 1 100%; }
    .ov-doc-row .r-end { margin-left: auto; }
  }

  /* the German tile label wraps at every width ("Proformarechnung ausgestellt"
     is 191px in the 165px label box): the dot rides the first line and the four
     counters share one baseline instead of drifting apart */
  .ov-tiles { grid-auto-rows: 1fr; }
  .ov-tile { display: flex; flex-direction: column; gap: 8px; }
  .ov-tile .t-label { align-items: flex-start; }
  .ov-tile .t-label .dot { margin-top: 6px; }
  .ov-tile .t-count { margin-top: auto; }
  .ov-dot[data-status="inquiry-received"] { background: var(--teal-500); }
  .ov-dot[data-status="proforma-issued"] { background: var(--warn); }
  .ov-dot[data-status="completed"] { background: var(--ok); }
  .ov-dot[data-status="cancelled"] { background: var(--faint); }

  .ov-body { padding: 22px; }
  .ov-empty { padding: 0; }
  .ov-contact { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 15px; font-weight: 500; }
  .ov-contact svg { flex: none; color: var(--teal-600); }
  .ov-dl {
    display: inline-flex; align-items: center; gap: 7px; min-height: 44px; margin-right: -10px; padding: 0 10px;
    border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--teal-700); white-space: nowrap;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .ov-dl:hover { background: var(--teal-50); text-decoration: none; }
  .ov-dl:active { transform: translateY(1px); }
  .ov-dl:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 2px; }
  .proto-note a[aria-current="page"] { color: var(--teal-700); font-weight: 700; }
</style>

<script>
const STR = {

    navInquiries: "Inquiries",

    navAccount: "Account",
    accountMenu: "Account menu",
    statusLabel: "Status",
    // welcome header
    welcome: "Welcome back",
    workspace: "Your account workspace",
    // the four inquiry states
    tReceived: "Inquiry received",
    tProforma: "Proforma invoice issued",
    tCompleted: "Completed",
    tCancelled: "Cancelled",
    // recent inquiries, newest first
    recentTitle: "Recent inquiries",
    viewAll: "View all",

    date2412: "6 October 2026",
    amount2412: "€8,475.50",
    date2399: "18 September 2026",
    amount2399: "€2,180.00",
    // documents
    documentsTitle: "Documents",
    docProforma: "Proforma invoice PI-2026-041 (PDF)",
    docReport: "Design report · Residential 10 kWh (PDF)",
    download: "Download",
    // contact person
    contactTitle: "Your contact person",
    // a new account before its first inquiry
    emptyInquiries: "No inquiries yet.",
    emptyDocuments: "Your Proforma invoices and the design reports of your saved solutions will appear here."
  },
  de: {
    pageTitle: "Übersicht",
    groupWorkplace: "Arbeitsbereich",
    groupAccount: "Konto",
    navOverview: "Übersicht",
    navInquiries: "Anfragen",
    navSaved: "Gespeicherte Lösungen",
    navDocuments: "Dokumente",
    navCompany: "Unternehmen",
    navAccountDetails: "Kontodetails",
    navLogout: "Abmelden",
    navAccount: "Konto",
    accountMenu: "Kontomenü",
    statusLabel: "Status",
    welcome: "Willkommen zurück",
    workspace: "Ihr persönlicher Arbeitsbereich",
    tReceived: "Anfrage eingegangen",
    tProforma: "Proformarechnung ausgestellt",
    tCompleted: "Abgeschlossen",

    recentTitle: "Neueste Anfragen",
    viewAll: "Alle anzeigen",
    date2418: "15. Oktober 2026",
    amount2418: "4.218,00\u00a0€",
    date2412: "6. Oktober 2026",
    amount2412: "8.475,50\u00a0€",
    date2399: "18. September 2026",
    amount2399: "2.180,00\u00a0€",
    documentsTitle: "Dokumente",
    docProforma: "Proformarechnung PI-2026-041 (PDF)",
    docReport: "Auslegungsbericht · Wohnhaus 10 kWh (PDF)",
    download: "Herunterladen",
    contactTitle: "Ihre Ansprechperson",
    emptyInquiries: "Noch keine Anfragen.",
    // no msgstr in linker-commerce-de_DE_formal.po — written here for the
    // formal voice; the .po line needs the same fix
    emptyDocuments: "Ihre Proformarechnungen und die Auslegungsberichte Ihrer gespeicherten Lösungen erscheinen hier."
  }
};

const STATES = ["default", "empty"];
const COUNTS = {
  default: { received: 2, proforma: 1, completed: 5, cancelled: 1 },
  empty: { received: 0, proforma: 0, completed: 0, cancelled: 0 }
};

const params = new URLSearchParams(location.search);
const lang = params.get("lang") === "de" ? "de" : "en";
const asked = params.get("state") || "default";
const state = STATES.includes(asked) ? asked : "default";
document.documentElement.lang = lang;

for (const el of document.querySelectorAll("[data-t]")) {
  const text = STR[lang][el.dataset.t];
  if (text) el.textContent = text;
}
// aria-labels are translated too: the two navs and the tiles region are the
// only named regions this page has that carry no visible label of their own
for (const el of document.querySelectorAll("[data-t-aria]")) {
  const text = STR[lang][el.dataset.tAria];
  if (text) el.setAttribute("aria-label", text);
}
for (const el of document.querySelectorAll("[data-count]")) {
  el.textContent = COUNTS[state][el.dataset.count];
}
for (const el of document.querySelectorAll("[data-when]")) {
  el.hidden = el.dataset.when !== state;
}
// every link to another prototype page keeps the language
for (const el of document.querySelectorAll("[data-lang-href]")) {
  const [path, query] = el.dataset.langHref.split("?");
  const p = new URLSearchParams(query || "");
  p.set("lang", lang);
  el.href = path + "?" + p.toString();
}
for (const el of document.querySelectorAll("[data-lang-link]")) {
  const target = el.dataset.langLink;
  el.classList.toggle("is-on", target === lang);
  const p = new URLSearchParams(location.search); p.set("lang", target);
  el.href = "?" + p.toString();
}
for (const el of document.querySelectorAll("[data-state-link]")) {
  const target = el.dataset.stateLink;
  const p = new URLSearchParams(location.search);
  p.set("lang", lang); p.set("state", target);
  el.href = "?" + p.toString();
  if (target === state) el.setAttribute("aria-current", "page");
}
// the download buttons are the prototype's dead end: the live site serves the
// PDF from a signed URL, so here they only keep their press feedback
for (const el of document.querySelectorAll("[data-download]")) {
  el.addEventListener("click", (e) => e.preventDefault());
}
</script>
</body>
</html>
