<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset your password · Linker account prototype</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* Page-local (prefix lp-): this is an auxiliary page, so it has no brand
     panel. app.css extends every .auth-inner to aside + card above 1080px,
     which would leave a lone card in the 460px column with its card look
     stripped. Neutralise that frame here and keep the card centred. */
  @media (min-width: 1080px) {
    .auth-inner.lp-solo { max-width: 480px; grid-template-columns: minmax(0, 1fr); gap: 20px; border-radius: 0; box-shadow: none; overflow: visible; }
    .auth-inner.lp-solo > .card { border: 1px solid var(--line-soft); border-radius: var(--r-xl); box-shadow: var(--shadow-card); }
  }
  /* The hidden attribute has to win over app.css display rules
     (.field .error-text is display:flex), so [hidden] is enforced here. */
  .lp-solo [hidden] { display: none; }
  .lp-error svg { flex: none; }
</style>
</head>
<body>

<header class="shell-head">
  <img src="assets/logo.webp" alt="Linker">
  <nav class="shell-lang" aria-label="Language">
    <a href="?lang=en" data-lang-link="en">EN</a>
    <a href="?lang=de" data-lang-link="de">DE</a>
  </nav>
</header>

<main class="auth">
  <div class="auth-inner lp-solo">

    <section class="card" aria-labelledby="lp-title">
      <header>
        <h1 id="lp-title" data-t="title"></h1>
        <p class="sub" id="lp-sub" data-t="sub"></p>
      </header>

      <div id="notice-slot"></div>

      <form id="lost-form" novalidate>
        <div class="field">
          <label for="lp-user"><span data-t="label"></span> <span class="req" aria-hidden="true">*</span></label>
          <input class="input" id="lp-user" name="user_login" type="text" autocomplete="username" data-t-ph="phUser">
          <p class="error-text lp-error" id="lp-user-error" role="alert" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span data-t="errRequired"></span>
          </p>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="lp-submit">
          <span class="spinner" hidden></span><span data-t="submit"></span>
        </button>
      </form>

      <p class="form-links">
        <a href="login.html" data-t="back"></a>
      </p>
    </section>

  </div>
</main>

<p class="proto-note">
  States:
  <a data-state-link="default">default</a> ·
  <a data-state-link="sent">reset link sent</a> ·
  <a data-state-link="invalid-key">invalid key</a> ·
  <a data-state-link="loading">submit loading</a>
</p>

<script>
const STR = {
  en: {
    title: "Reset your password",
    sub: "Lost your password? Please enter your username or email address. You will receive a link to create a new password via email.",
    subSent: "A password reset email has been sent to the email address on file for your account, but may take several minutes to show up in your inbox. Please wait at least 10 minutes before attempting another reset.",
    label: "Username or email",
    phUser: "you@company.com",
    submit: "Reset password",
    back: "Back to sign in",
    errRequired: "Username or email is a required field.",
    okSent: "Password reset email has been sent.",
    errKey: "This key is invalid or has already been used. Please reset your password again if needed."
  },
  de: {
    title: "Passwort zurücksetzen",
    sub: "Haben Sie Ihr Passwort vergessen? Bitte geben Sie Ihren Benutzernamen oder Ihre E-Mail-Adresse ein. Sie erhalten einen Link per E-Mail, mit dem Sie ein neues Passwort erstellen können.",
    subSent: "Eine E-Mail zum Zurücksetzen des Passworts wurde an Ihre E-Mail-Adresse gesendet. Es kann jedoch dauern, bis die E-Mail in Ihrem Postfach erscheint. Bitte warten Sie mindestens 10\u00A0Minuten, bis Sie es erneut versuchen.",
    label: "Benutzername oder E-Mail-Adresse",
    phUser: "sie@firma.de",
    submit: "Passwort zurücksetzen",
    back: "Zurück zur Anmeldung",
    errRequired: "„Benutzername oder E-Mail-Adresse“ ist ein Pflichtfeld.",
    okSent: "Es wurde eine E-Mail zum Zurücksetzen des Passworts versandt.",
    errKey: "Der Schlüssel ist ungültig oder wurde bereits verwendet. Bitte setzen Sie bei Bedarf Ihr Passwort erneut zurück."
  }
};

const params = new URLSearchParams(location.search);
const lang = params.get("lang") === "de" ? "de" : "en";
const state = params.get("state") || "default";
document.documentElement.lang = lang;

for (const el of document.querySelectorAll("[data-t]")) {
  const key = el.dataset.t;
  if (STR[lang][key]) el.textContent = STR[lang][key];
}
for (const el of document.querySelectorAll("[data-t-ph]")) {
  const key = el.dataset.tPh;
  if (STR[lang][key]) el.placeholder = STR[lang][key];
}
for (const el of document.querySelectorAll("[data-lang-link]")) {
  const target = el.dataset.langLink;
  el.classList.toggle("is-on", target === lang);
  const p = new URLSearchParams(location.search); p.set("lang", target);
  el.href = "?" + p.toString();
}
for (const el of document.querySelectorAll("[data-state-link]")) {
  const p = new URLSearchParams(location.search);
  p.set("lang", lang); p.set("state", el.dataset.stateLink);
  el.href = "?" + p.toString();
}

const ICON_ERR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';
const ICON_OK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>';

const slot = document.getElementById("notice-slot");
function notice(kind, text, focus) {
  slot.innerHTML = `<div class="notice notice-${kind}" role="${kind === "error" ? "alert" : "status"}"${focus ? ' tabindex="-1"' : ""}>${kind === "error" ? ICON_ERR : ICON_OK}<div>${text}</div></div>`;
  if (focus) slot.firstElementChild.focus();
}

const form = document.getElementById("lost-form");
const input = document.getElementById("lp-user");
const fieldError = document.getElementById("lp-user-error");
const submitBtn = document.getElementById("lp-submit");
const spinner = submitBtn.querySelector(".spinner");
const sub = document.getElementById("lp-sub");

function setLoading(on) {
  submitBtn.classList.toggle("is-loading", on);
  spinner.hidden = !on;
  form.setAttribute("aria-busy", on ? "true" : "false");
}
function setFieldError(on) {
  fieldError.hidden = !on;
  if (on) {
    input.setAttribute("aria-invalid", "true");
    input.setAttribute("aria-describedby", "lp-user-error");
  } else {
    input.removeAttribute("aria-invalid");
    input.removeAttribute("aria-describedby");
  }
}
function showSent(focus) {
  notice("success", STR[lang].okSent, focus);
  sub.textContent = STR[lang].subSent;
  form.hidden = true;
}

if (state === "sent") showSent(false);
if (state === "invalid-key") notice("error", STR[lang].errKey);
if (state === "loading") setLoading(true);

input.addEventListener("input", () => {
  if (!fieldError.hidden) setFieldError(false);
});

// submit: the prototype demonstrates the round trip; the real form posts the page.
form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (!input.value.trim()) {
    setFieldError(true);
    input.focus();
    return;
  }
  setFieldError(false);
  setLoading(true);
  setTimeout(() => {
    setLoading(false);
    showSent(true);
  }, 1200);
});
</script>
</body>
</html>
