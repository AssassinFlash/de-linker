<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Linker account prototype</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="shell-head">
  <img src="assets/logo.webp" alt="Linker">
  <nav class="shell-lang" aria-label="Language">
    <a href="?lang=en" data-lang-link="en">EN</a>
    <a href="?lang=de" data-lang-link="de">DE</a>
  </nav>
</header>

<main class="auth">
  <div class="auth-inner">

    <aside class="brand" aria-hidden="true">
      <img src="assets/logo-wordmark.png" alt="">
      <div>
        <h1 data-t="brandTitle"></h1>
        <p data-t="brandSub"></p>
      </div>
      <ul>
        <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span data-t="brandPoint1"></span></li>
        <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg><span data-t="brandPoint2"></span></li>
        <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span data-t="brandPoint3"></span></li>
      </ul>
    </aside>

    <section class="card" aria-labelledby="signin-title">
      <header>
        <h1 id="signin-title" data-t="title"></h1>
        <p class="sub" data-t="sub"></p>
      </header>

      <div id="notice-slot"></div>

      <form id="signin-form" novalidate>
        <div class="field">
          <label for="f-user"><span data-t="labelUser"></span> <span class="req" aria-hidden="true">*</span></label>
          <input class="input" id="f-user" name="username" type="text" autocomplete="username" data-t-ph="phUser">
        </div>
        <div class="field">
          <label for="f-pass"><span data-t="labelPass"></span> <span class="req" aria-hidden="true">*</span></label>
          <div class="password-wrap">
            <input class="input" id="f-pass" name="password" type="password" autocomplete="current-password">
            <button type="button" class="password-toggle" aria-label="Show password" data-eye>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field" style="margin-bottom: 22px;">
          <label class="check">
            <input type="checkbox" name="rememberme" value="forever">
            <span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span data-t="remember"></span>
          </label>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">
          <span class="spinner" hidden></span><span data-t="submit"></span>
        </button>
        <div class="form-links">
          <a href="lost-password.html" data-t="lost"></a>
          <a href="register.html"><span data-t="noAccount"></span> <strong data-t="create"></strong></a>
        </div>
      </form>
    </section>

  </div>
</main>

<p class="proto-note">
  States:
  <a data-state-link="default">default</a> ·
  <a data-state-link="error">wrong password</a> ·
  <a data-state-link="rejected">rejected account</a> ·
  <a data-state-link="reset-success">password reset ok</a> ·
  <a data-state-link="signed-out">signed out</a> ·
  <a data-state-link="loading">submit loading</a>
</p>

<script>
const STR = {
  en: {
    title: "Sign in",
    sub: "Your inquiries, documents and prices in one place.",
    labelUser: "Username or email address",
    phUser: "you@company.com",
    labelPass: "Password",
    remember: "Remember me",
    submit: "Log in",
    lost: "Lost your password?",
    noAccount: "No partner account yet?",
    create: "Create your business account",
    brandTitle: "Your partner account",
    brandSub: "The workspace for installers, EPCs and distributors.",
    brandPoint1: "Net prices and Proforma requests once approved",
    brandPoint2: "Every inquiry and document in one place",
    brandPoint3: "We answer inquiries within one working day",
    errWrong: "The username or the password is not correct.",
    errRejected: "This account is not approved for sign-in. We have emailed you the reason. Write to sales@de-linker.com and we will look at it again.",
    okReset: "Your password has been reset successfully.",
    signedOut: "You have been signed out."
  },
  de: {
    title: "Anmelden",
    sub: "Ihre Anfragen, Dokumente und Preise an einem Ort.",
    labelUser: "Benutzername oder E-Mail-Adresse",
    phUser: "sie@firma.de",
    labelPass: "Passwort",
    remember: "Angemeldet bleiben",
    submit: "Anmelden",
    lost: "Passwort vergessen?",
    noAccount: "Noch kein Partnerkonto?",
    create: "Erstellen Sie Ihr Firmenkonto",
    brandTitle: "Ihr Partnerkonto",
    brandSub: "Der Arbeitsbereich für Installateure, EPCs und Händler.",
    brandPoint1: "Nettopreise und Proforma-Anfragen nach Freischaltung",
    brandPoint2: "Alle Anfragen und Dokumente an einem Ort",
    brandPoint3: "Wir beantworten Anfragen innerhalb eines Arbeitstages",
    errWrong: "Benutzername oder Passwort ist nicht korrekt.",
    errRejected: "Dieses Konto ist nicht zur Anmeldung freigegeben. Den Grund haben wir Ihnen per E-Mail geschickt. Schreiben Sie an sales@de-linker.com; wir sehen uns Ihr Konto erneut an.",
    okReset: "Ihr Passwort wurde erfolgreich zurückgesetzt.",
    signedOut: "Sie wurden abgemeldet."
  }
};

const params = new URLSearchParams(location.search);
const lang = params.get("lang") === "de" ? "de" : "en";
const state = params.get("state") || "default";
document.documentElement.lang = lang === "de" ? "de" : "en";

for (const el of document.querySelectorAll("[data-t]")) {
  const key = el.dataset.t;
  if (STR[lang][key]) el.textContent = STR[lang][key];
}
for (const el of document.querySelectorAll("[data-t-ph]")) {
  const key = el.dataset.tPh;
  if (STR[lang][key]) el.placeholder = STR[lang][key];
}
for (const el of document.querySelectorAll("[data-lang-link]")) {
  const target = el.dataset.langLink;
  el.classList.toggle("is-on", target === lang);
  const p = new URLSearchParams(location.search); p.set("lang", target);
  el.href = "?" + p.toString();
}
for (const el of document.querySelectorAll("[data-state-link]")) {
  const p = new URLSearchParams(location.search);
  p.set("lang", lang); p.set("state", el.dataset.stateLink);
  el.href = "?" + p.toString();
}

const ICON_ERR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';
const ICON_OK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>';

const slot = document.getElementById("notice-slot");
function notice(kind, text) {
  slot.innerHTML = `<div class="notice notice-${kind}" role="${kind === "error" ? "alert" : "status"}">${kind === "error" ? ICON_ERR : ICON_OK}<div>${text}</div></div>`;
}
if (state === "error") notice("error", STR[lang].errWrong);
if (state === "rejected") notice("error", STR[lang].errRejected);
if (state === "reset-success") notice("success", STR[lang].okReset);
if (state === "signed-out") notice("info", STR[lang].signedOut);

// password eye toggle
document.querySelector("[data-eye]").addEventListener("click", (e) => {
  const btn = e.currentTarget, input = document.getElementById("f-pass");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
  btn.style.color = show ? "var(--teal-700)" : "";
});

// submit: the prototype demonstrates the loading state; the real form posts the page.
const form = document.getElementById("signin-form");
const submitBtn = document.getElementById("submit-btn");
if (state === "loading") {
  submitBtn.classList.add("is-loading");
  submitBtn.querySelector(".spinner").hidden = false;
}
form.addEventListener("submit", (e) => {
  e.preventDefault();
  submitBtn.classList.add("is-loading");
  submitBtn.querySelector(".spinner").hidden = false;
  setTimeout(() => {
    submitBtn.classList.remove("is-loading");
    submitBtn.querySelector(".spinner").hidden = true;
    notice("error", STR[lang].errWrong);
  }, 1200);
});
</script>
</body>
</html>
