// Portable in-memory transition module: no DOM, storage, network, clock or model.
const HandoffModel=(()=>{
 const emptyFields=()=>({plz:'',annual_kwh:'',pv_kwp:'',phase:'',backup:''});
 const known={plz:'80538',annual_kwh:'6000',pv_kwp:'10',phase:'1',backup:'needed'};
 const initial=(scenario='normal')=>({scenario,mode:['ambiguous','structured','downstream','concurrent','noteOnly','emptyExcluded','identity','recovery'].includes(scenario)?'planning':'assistant',source:'SAJ H2-10K · -40 °C · Which battery works with this inverter?',draft:'',attempt:null,transcript:'',uploads:[],missingFiles:[],attemptCounter:0,claimed:[],commits:0,origins:{},status:'editing',project:null,fields:emptyFields(),confirmed:{},saved:null,report:null,draftNote:null,inquiry:null,operation:null,orderCreates:0,notificationClaims:0,itemsAdded:0,cartHasItems:false,customerMessage:'',include:true,notice:'',revision:0,step:0});
 function accept(s){if(!s.attempt)return s;if(s.claimed.includes(s.attempt.id)){s.notice='dedup';return s}if(s.status!=='loading')return s;s.claimed.push(s.attempt.id);s.draft=s.attempt.original;s.status=s.attempt.mode==='send'?'answering':'composing';if(s.attempt.mode==='send')s.commits++;return s;}
 function reduce(state,action){const s=structuredClone(state);s.notice='';switch(action.type){
 case 'source':s.source=action.text;return s;
 case 'submit':if(s.attempt&&['loading','answering'].includes(s.status)){s.notice='busy';return s;}if(!s.source.trim())return s;s.attempt={id:'entry-'+(++s.attemptCounter),original:s.source,mode:'send'};s.status='loading';return s;
 case 'attach':case 'voice':if(['loading','answering'].includes(s.status))return s;s.attempt={id:'entry-'+(++s.attemptCounter),original:s.source,mode:action.type};s.status='loading';return s;
 case 'bootFailure':if(s.status==='loading')s.status='loadFailed';return s;
 case 'retry':if(s.status==='loadFailed'||s.status==='recoverable')s.status='loading';return s;
 case 'ready':case 'duplicate':return accept(s);
 case 'nextDraft':s.source='A different question for the next turn.';return s;
 case 'answer':if(s.status==='answering'){s.transcript=s.draft;s.status='answered'}return s;
 case 'cancelFile':s.notice='fileCanceled';return s;
 case 'sampleFile':if(s.status==='composing'){s.uploads=['schematic.pdf'];s.missingFiles=[]}return s;
 case 'dictate':if(s.status==='composing')s.draft+=' Please include backup.';return s;
 case 'denyVoice':s.notice='voiceDenied';return s;
 case 'sendDraft':if(s.status==='composing'&&s.draft.trim()){s.status='answering';s.commits++}return s;
 case 'reload':if(['loading','loadFailed'].includes(s.status))s.status='recoverable';s.notice='reload';if(s.uploads.length){s.missingFiles=[...s.uploads];s.uploads=[];s.notice='reloadMissing'}return s;
 case 'plan':s.mode='planning';s.revision=1;s.project={id:'project-1',text:s.source,revision:1};s.status='review';s.fields=emptyFields();s.confirmed={};s.origins={};return s;
 case 'structured':if(!s.project){s.project={id:'project-1',text:s.source,revision:1};s.revision=1}s.fields={...known};s.origins=Object.fromEntries(Object.keys(known).map(k=>[k,'carried']));s.status='review';s.notice='structured';return s;
 case 'field':s.fields[action.key]=action.value;s.origins[action.key]='entered';delete s.confirmed[action.key];if(s.project){s.project.revision=++s.revision}s.status='review';return s;
 case 'defaults':s.fields.phase='3';s.fields.backup='none';s.origins.phase='default';s.origins.backup='default';return s;
 case 'switchIdentity':s.operation=null;s.orderCreates=0;s.notificationClaims=0;s.itemsAdded=0;s.cartHasItems=false;s.source='';s.draft='';s.attempt=null;s.transcript='';s.uploads=[];s.missingFiles=[];s.project=null;s.fields=emptyFields();s.confirmed={};s.saved=null;s.report=null;s.draftNote=null;s.inquiry=null;s.customerMessage='';s.status='identityChanged';s.notice='identity';return s;
 case 'apply':for(const [key,value]of Object.entries(s.fields))if(value!=='')s.confirmed[key]=value;s.notice='applied';return s;
 case 'calculate':if(!['plz','annual_kwh','pv_kwp','phase'].every(k=>s.confirmed[k])){s.notice='incomplete';return s}s.status='result';return s;
 case 'save':if(s.status==='result')s.saved={...s.project};return s;
 case 'report':if(s.status==='result')s.report={...s.project};return s;
 case 'add':if(s.status==='result'){if(!s.itemsAdded)s.itemsAdded=1;s.cartHasItems=true;s.status='notePending'}return s;
 case 'noteFailure':if(s.status==='notePending')s.status='noteFailed';return s;
 case 'noteReadback':if(['notePending','noteFailed'].includes(s.status)){s.draftNote={...s.project};s.status='draftReady'}return s;
 case 'include':s.include=action.value;return s;
 case 'inquiry':case 'reviewNotes':if(['draftReady','inquiryStale'].includes(s.status)){s.inquiry=s.include&&s.draftNote?{...s.draftNote}:null;s.status='inquiryReview'}return s;
 case 'reserve':if(s.status!=='inquiryReview')return s;if(s.inquiry&&(!s.draftNote||s.inquiry.revision!==s.draftNote.revision)){s.status='inquiryStale';return s}if(!s.cartHasItems&&!s.customerMessage.trim()&&!s.inquiry?.text.trim()){s.notice='emptyInquiry';return s}if(!s.operation)s.operation={id:'operation-1',note:s.inquiry?{...s.inquiry}:null,orderId:null,received:false,consumed:false};s.status='reserved';return s;
 case 'createOrder':if(!s.operation)return s;if(!s.operation.orderId){s.operation.orderId='inquiry-1';s.orderCreates++}s.status='orderCreated';return s;
 case 'receiveOrder':if(!s.operation?.orderId)return s;if(!s.operation.received){s.operation.received=true;s.notificationClaims++}s.status='orderReceived';return s;
 case 'consume':if(!s.operation?.received)return s;if(s.operation.note&&s.draftNote?.revision===s.operation.note.revision)s.draftNote=null;s.inquiry=s.operation.note;s.operation.consumed=true;s.cartHasItems=false;s.status='received';return s;
 case 'crash':if(s.operation)s.status='interrupted';return s;
 case 'recover':if(s.operation)s.status=s.operation.consumed?'received':s.operation.received?'orderReceived':s.operation.orderId?'orderCreated':'reserved';return s;
 case 'receive':{let next=reduce(s,{type:'reserve'});if(next.status!=='reserved')return next;for(const type of ['createOrder','receiveOrder','consume'])next=reduce(next,{type});return next;}
 case 'concurrentNote':if(s.draftNote){s.draftNote.revision++;s.draftNote.text+=' · Updated requirement from another tab.'}return s;
 case 'removeProducts':s.cartHasItems=false;return s;
 case 'exclude':s.include=false;return s;
 case 'message':s.customerMessage=action.text;return s;
 case 'sampleMessage':s.customerMessage='Please check the required accessories.';return s;
 case 'noCandidate':if(s.project)s.status='noCandidate';return s;
 case 'carryNote':if(s.project){s.draftNote={...s.project};s.status='draftReady'}return s;
 case 'askNote':if(s.project){s.attempt={id:'entry-note',original:s.project.text,mode:'send'};s.draft=s.project.text;s.status='loading';s.mode='assistant'}return s;
 default:return s;
 }}return {initial,reduce,known};})();

const scenarios={normal:{name:['Typed question','Getippte Frage'],description:['Send once through cold loading and confirm that the complete original becomes the question.','Einmal senden und laden: Die vollständige ursprüngliche Eingabe wird zur Frage.'],steps:['submit','ready','answer']},failure:{name:['Load failure and retry','Ladefehler und Wiederholung'],description:['Loading fails before the app owns the question. A return and explicit retry must keep the same snapshot.','Vor der Übernahme schlägt das Laden fehl. Nach einer Rückkehr bleibt dieselbe Eingabe erneut nutzbar.'],steps:['submit','bootFailure','reload','retry','ready','answer']},attachment:{name:['Draft with attachment','Text mit Anhang'],description:['Open an attachment flow with existing text, cancel once, then choose a sample file and send them together.','Mit vorhandenem Text einen Anhang öffnen, einmal abbrechen und danach PDF und Text gemeinsam senden.'],steps:['attach','ready','cancelFile','sampleFile','sendDraft','answer']},ambiguous:{name:['Unclear equipment note','Unklare Gerätenotiz'],description:['A model number and a temperature remain a note. They must not become PV power, annual use or a postcode.','Modellnummer und Temperatur bleiben als Notiz erhalten. Daraus entstehen weder PV-Leistung noch Jahresverbrauch oder Postleitzahl.'],steps:['plan','apply','calculate','reload']},structured:{name:['Known sizing fields','Bekannte Auslegungsdaten'],description:['Only an explicit structured SizeHint fixture prefills the five rows. Apply them, then continue.','Nur ein ausdrücklich strukturiertes SizeHint-Beispiel befüllt die fünf Felder. Bestätigen und fortfahren.'],steps:['plan','structured','apply','calculate']},downstream:{name:['Note through inquiry','Notiz bis zur Anfrage'],description:['Save and export the note, then simulate a partial draft update. Retrying only the note must not add products again.','Notiz speichern und ausgeben, dann eine unvollständige Übernahme simulieren. Ein erneuter Notizversuch fügt keine Produkte hinzu.'],steps:['plan','structured','apply','calculate','save','report','add','noteFailure','noteReadback','inquiry','receive']},concurrent:{name:['Concurrent note update','Zeitgleiche Notizänderung'],description:['Another tab changes the note after inquiry review. Sending must stop without losing the separate customer message.','Nach der Anfrageprüfung ändert ein anderer Tab die Notiz. Der Versand stoppt; die eigene Nachricht bleibt erhalten.'],steps:['plan','structured','apply','calculate','add','noteReadback','sampleMessage','inquiry','concurrentNote','receive','reviewNotes','receive']},noteOnly:{name:['Note-only inquiry','Anfrage nur mit Notiz'],description:['No system matches and no product is added. A visible included project note still constitutes an inquiry.','Es gibt kein passendes System und keine Produkte. Die sichtbar ausgewählte Projektnotiz bleibt eine gültige Anfrage.'],steps:['plan','noCandidate','carryNote','inquiry','receive']},emptyExcluded:{name:['Excluded empty inquiry','Leere Anfrage ohne Notiz'],description:['With no products or message, excluding the note leaves an empty request. Nothing is sent; the message stays editable.','Ohne Produkte und Nachricht ist die Anfrage leer, wenn die Notiz abgewählt wird. Nichts wird versendet; die Nachricht bleibt bearbeitbar.'],steps:['plan','noCandidate','carryNote','exclude','inquiry','receive']},duplicate:{name:['Duplicate delivery','Doppelte Zustellung'],description:['A warm repeated event or lost acknowledgement replays acceptance, never a second question commit.','Ein wiederholtes Ereignis oder eine verlorene Bestätigung führt nicht zu einer zweiten Frage.'],steps:['submit','ready','duplicate','duplicate','answer']},nextDraft:{name:['Next question while busy','Folgefrage während Bearbeitung'],description:['The first snapshot stays fixed. A different next question remains editable and sends after the first completes.','Die erste Frage bleibt unverändert. Eine andere Folgefrage bleibt erhalten und wird erst danach gesendet.'],steps:['submit','ready','nextDraft','submit','answer','submit','ready','answer']},unsentFile:{name:['Refresh before file send','Neuladen vor Dateiversand'],description:['Text returns, but an unsent in-memory file is explicitly missing and must be picked again.','Der Text bleibt erhalten. Eine ungesendete Datei muss ausdrücklich erneut ausgewählt werden.'],steps:['attach','ready','sampleFile','reload','sampleFile','sendDraft','answer']},identity:{name:['Customer switch','Kundenwechsel'],description:['Changing customer context removes the previous note from the visible draft; it never becomes the next customer’s input.','Nach dem Kundenwechsel erscheint die vorherige Notiz nicht in der neuen Eingabe.'],steps:['plan','structured','apply','calculate','save','switchIdentity']},recovery:{name:['Interrupted inquiry','Unterbrochene Anfrage'],description:['A persisted inquiry survives two interrupted responses. Recovery uses the same record and notification claim; consuming the old note leaves a later revision intact.','Zwei unterbrochene Antworten erzeugen keine zweite Anfrage oder Nachricht. Die spätere Notizversion bleibt nach Abschluss erhalten.'],steps:['plan','structured','apply','calculate','add','noteReadback','inquiry','reserve','createOrder','crash','recover','receiveOrder','crash','recover','concurrentNote','consume']}};
let lang='en',s=HandoffModel.initial(),guided=0;const $=id=>document.getElementById(id),t=key=>words[lang][key]??key;const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(action,key,primary=false){return `<button data-action="${action}" class="${primary?'primary':''}">${t(key)}</button>`}function render(){document.documentElement.lang=lang;for(const id of ['title','intro','scope','stateTitle','guideTitle','guideHint','freeTitle','next','reset'])$(id).textContent=t(id);$('en').setAttribute('aria-pressed',lang==='en');$('de').setAttribute('aria-pressed',lang==='de');const scenario=scenarios[s.scenario];$('tabs').innerHTML=Object.entries(scenarios).map(([key,v])=>`<button role="tab" data-scenario="${key}" aria-selected="${key===s.scenario}">${v.name[lang==='en'?0:1]}</button>`).join('');$('scenarioDescription').textContent=scenario.description[lang==='en'?0:1];$('steps').innerHTML=scenario.steps.map((a,i)=>`<li style="font-weight:${i===guided?'700':'400'}">${actionLabel(a)}${i<guided?' ✓':''}</li>`).join('');$('next').disabled=guided>=scenario.steps.length;
 let content=`<h2>${t('sourceTitle')}</h2><div class="source"><label for="sourceInput">${t('sourceLabel')}</label><textarea id="sourceInput">${escapeHtml(s.source)}</textarea><div class="actions">${button('attach','attach')}${button('voice','voice')}${button('submit','send',true)}</div><div class="chips"><button data-action="suggestion">${t('suggestion')}</button>${button('plan','plan')}</div></div>`;
 if(s.mode==='assistant'&&s.attempt){content+=`<section class="panel"><h2>${t('assistant')}</h2><div role="status" class="notice ${s.status==='loadFailed'?'error':''}">${t(({loading:'loading',loadFailed:'loadFailed',recoverable:'recover',answering:'answering',answered:'answered',composing:'compose'})[s.status]||'draftKeep')}</div>`;if(s.draft||s.attempt.original)content+=`<div class="message">${escapeHtml(s.draft||s.attempt.original)}</div>`;if(s.uploads.length)content+=`<p><span class="file">${escapeHtml(s.uploads.join(', '))}</span></p>`;content+='<div class="actions">';if(s.status==='loading')content+=button('ready','ready',true)+button('bootFailure','fail');if(['loadFailed','recoverable'].includes(s.status))content+=button('retry','retry',true);if(s.status==='composing')content+=button('sampleFile','file')+button('cancelFile','cancel')+button('dictate','dictate')+button('denyVoice','deny')+button('sendDraft','sendDraft',true);if(s.status==='answering')content+=button('answer','answer',true);content+=button('reload','reload')+'</div></section>'}
 if(s.mode==='planning'){content+=`<section class="panel"><h2>${t('configurator')}</h2>`;if(!s.project)content+=button('plan','plan',true);else{content+=`<div class="labelrow"><h3>${t('noteTitle')}</h3><p class="scope-note">${t('noteScope')}</p></div><div class="note">${escapeHtml(s.project.text)}</div><p class="muted">${t('noteHelp')}</p><h3>${t('details')}</h3><div class="columns">`;for(const key of ['plz','annual_kwh','pv_kwp','phase','backup']){let input;if(['phase','backup'].includes(key)){const choices=key==='phase'?[['','choose'],['1','one'],['3','three']]:[['','choose'],['none','none'],['needed','needed'],['needed_accessory_ok','accessory']];input=`<select id="f-${key}" data-field="${key}">${choices.map(([v,label])=>`<option value="${v}" ${s.fields[key]===v?'selected':''}>${t(label)}</option>`).join('')}</select>`}else input=`<input id="f-${key}" data-field="${key}" value="${escapeHtml(s.fields[key])}" inputmode="${key==='plz'?'numeric':'decimal'}">`;content+=`<div class="field"><label for="f-${key}">${t(key)}</label>${input}<div class="status ${s.confirmed[key]?'ok':''}">${t(s.confirmed[key]?'confirmed':s.fields[key]?(s.origins[key]||'entered'):'unknown')}</div></div>`}content+=`</div><div class="actions" style="margin-top:16px">${button('apply','apply',true)}${button('structured','known')}${button('calculate','calc')}</div><p class="status">${t('required')}: ${['plz','annual_kwh','pv_kwp','phase'].filter(k=>!s.confirmed[k]).map(t).join(' · ')||'—'}</p><p class="muted">${t('unknownNote')}</p>${button('askNote','ask')}<div class="artifact-actions">${button('save','save')}${button('report','report')}${button('add','add')}${button('reload','reload')}</div>`;if(['result','notePending','noteFailed','draftReady','inquiryReview','inquiryStale','received'].includes(s.status))content+=`<div class="notice"><h3>${t('result')}</h3>${t('noCalc')}</div>`;if(s.status==='notePending')content+=`<div class="actions">${button('noteFailure','noteFailure')}${button('noteReadback','readback',true)}</div>`;if(s.status==='noteFailed')content+=`<div class="notice error">${t('partial')}</div>${button('noteReadback','noteRetry',true)}`;if(s.status==='draftReady')content+=`<label class="include"><input type="checkbox" id="include" ${s.include?'checked':''}>${t('include')}</label>${button('inquiry','inquiry',true)}`;if(s.status==='noCandidate')content+=`<div class="notice">${t('noCandidate')}</div>${button('carryNote','carryNote',true)}`;if(['inquiryReview','inquiryStale'].includes(s.status))content+=`<div class="record"><label for="customerMessage">${t('messageLabel')}</label><textarea id="customerMessage">${escapeHtml(s.customerMessage)}</textarea></div>`;if(s.status==='inquiryReview')content+=button('receive','receive',true)+button('concurrentNote','concurrentNote');if(s.status==='inquiryStale')content+=`<div class="notice error">${t('stale')}</div>${button('reviewNotes','reviewNotes',true)}`;for(const [key,title]of[['saved','saved'],['report','pdf'],['draftNote','draft'],['inquiry','order']])if(s[key])content+=`<div class="record"><h3>${t(key==='inquiry'&&s.status!=='received'?'inquiryPreview':title)} · ${t('customerNote')}</h3><div class="note">${escapeHtml(s[key].text)}</div><p class="muted">${t('noteScope')}</p></div>`;if(s.status==='received')content+=`<div class="notice">${t('received')}</div>`}content+='</section>'}
 if(s.notice)content+=`<div role="status" class="notice ${s.notice==='incomplete'?'error':''}">${t(({fileCanceled:'fileCanceled',voiceDenied:'voiceDenied',reload:'reloadText',structured:'structuredText',applied:'applied',incomplete:'incomplete',emptyInquiry:'emptyInquiry',reloadMissing:'reloadMissing',busy:'busy',dedup:'dedup',identity:'identity'})[s.notice]||s.notice)}</div>`;$('demo').innerHTML=content;const entries=[['stage',s.status],['original',s.source],['pending',s.attempt?.original||'—'],['delivered',s.transcript||'—'],['files',s.uploads.join(', ')||'—'],['missingFiles',s.missingFiles.join(', ')||'—'],['commits',String(s.commits)],['fieldCount',`${Object.keys(s.confirmed).length} / 5`],['items',String(s.itemsAdded)],['orders',String(s.orderCreates)],['notifications',String(s.notificationClaims)],['operation',s.operation?`${s.operation.id} · ${s.operation.orderId||'—'} · ${s.operation.consumed?'consumed':s.operation.received?'received':'pending'}`:'—'],['saved',s.saved?t('retained'):t('empty')],['pdf',s.report?t('retained'):t('empty')],['draft',s.draftNote?t('retained'):t('empty')],[s.operation?.orderId?'order':'inquiryPreview',s.inquiry?t('retained'):t('empty')]];$('state').innerHTML=entries.map(([key,value])=>`<dt>${t(key)}</dt><dd>${escapeHtml(value)}</dd>`).join('');$('free').innerHTML=['submit','ready','bootFailure','retry','attach','cancelFile','sampleFile','voice','dictate','denyVoice','reload','plan','structured','apply','calculate','save','report','add','noteFailure','noteReadback','removeProducts','exclude','sampleMessage','concurrentNote','reviewNotes','noCandidate','carryNote','inquiry','receive','duplicate','nextDraft','defaults','switchIdentity','reserve','createOrder','receiveOrder','consume','crash','recover'].map(a=>`<button data-action="${a}">${actionLabel(a)}</button>`).join('')}
function actionLabel(a){return t(({submit:'send',ready:'ready',bootFailure:'fail',retry:'retry',answer:'answer',attach:'attach',voice:'voice',cancelFile:'cancel',sampleFile:'file',dictate:'dictate',denyVoice:'deny',sendDraft:'sendDraft',reload:'reload',plan:'plan',structured:'known',apply:'apply',calculate:'calc',save:'save',report:'report',add:'add',noteFailure:'noteFailure',noteReadback:'readback',inquiry:'inquiry',receive:'receive',askNote:'ask',removeProducts:'removeProducts',exclude:'exclude',sampleMessage:'sampleMessage',concurrentNote:'concurrentNote',reviewNotes:'reviewNotes',noCandidate:'noCandidate',carryNote:'carryNote',duplicate:'duplicate',nextDraft:'nextDraft',defaults:'defaultAction',switchIdentity:'switchIdentity',reserve:'reserve',createOrder:'createOrder',receiveOrder:'receiveOrder',consume:'consume',crash:'crash',recover:'recover'})[a]||a)}function act(type){if(type==='suggestion')s=HandoffModel.reduce(s,{type:'source',text:t('suggestion')});else s=HandoffModel.reduce(s,{type});render()}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action)act(action.dataset.action);const tab=e.target.closest('[data-scenario]');if(tab){s=HandoffModel.initial(tab.dataset.scenario);guided=0;render()}});document.addEventListener('input',e=>{if(e.target.id==='sourceInput')s=HandoffModel.reduce(s,{type:'source',text:e.target.value});else if(e.target.id==='customerMessage')s=HandoffModel.reduce(s,{type:'message',text:e.target.value});else if(e.target.dataset.field)s=HandoffModel.reduce(s,{type:'field',key:e.target.dataset.field,value:e.target.value})});document.addEventListener('change',e=>{if(e.target.dataset.field&&e.target.tagName==='SELECT'){s=HandoffModel.reduce(s,{type:'field',key:e.target.dataset.field,value:e.target.value});render()}if(e.target.id==='include'){s=HandoffModel.reduce(s,{type:'include',value:e.target.checked});render()}});$('en').onclick=()=>{lang='en';render()};$('de').onclick=()=>{lang='de';render()};$('next').onclick=()=>{const action=scenarios[s.scenario].steps[guided++];act(action)};$('reset').onclick=()=>{s=HandoffModel.initial(s.scenario);guided=0;render()};render();
