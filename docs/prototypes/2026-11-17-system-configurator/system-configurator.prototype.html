<script>
'use strict';
// A throwaway interaction prototype. Equipment and energy examples are not engineering releases.
let lang='en',step=0,scene=0,toastTimer,importRows=[],csvPage=0;
const L=(en,de,zh)=>({en,de,zh})[lang];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=(x,d=1)=>Number(x).toLocaleString(lang==='de'?'de-DE':lang==='zh'?'zh-CN':'en-GB',{maximumFractionDigits:d});
const copy=o=>structuredClone(o);
const countries=['AL','AD','AM','AT','AZ','BY','BE','BA','BG','HR','CY','CZ','DK','EE','FI','FR','GE','DE','GR','HU','IS','IE','IT','XK','LV','LI','LT','LU','MT','MD','MC','ME','NL','MK','NO','PL','PT','RO','RU','SM','RS','SK','SI','ES','SE','CH','TR','UA','GB','VA'];
const names=()=>new Intl.DisplayNames([lang],{type:'region'});
const sceneLabels=()=>[L('New home with solar','Neubau mit Photovoltaik','新住宅光储'),L('PV size already known','PV-Größe bereits bekannt','已有光伏规模'),L('Add storage to an existing system','Bestehende Anlage erweitern','已有系统加储能'),L('Equipment already selected','Geräte bereits ausgewählt','已有目标设备'),L('Commercial storage','Gewerbespeicher','工商业纯储能'),L('Large energy project','Großes Energieprojekt','大型项目')];
function initial(i){const b={name:['Canal house','Workshop','Existing home','Farm building','Distribution centre','Energy project'][i],country:['NL','GB','BE','AT','NO','ES'][i],city:['Utrecht','Bristol','Gent','Graz','Oslo','Valencia'][i],scope:i>=4?'storage':'both',goal:i===4||i===5?'peak':'self',annual:[5000,18000,6500,22000,320000,2500000][i],profile:i>=4?'business':'evening',existing:i===2,existingName:'Existing PV inverter',keepExisting:true,existingPower:8,pvMode:i===0?'roof':'known',count:[24,40,20,60,0,0][i],modulePower:450,annualSource:'example',requestKW:[10,20,8,30,100,1000][i],requestKWh:[10,20,10,30,200,2000][i],backupPower:[2,5,2,6,50,300][i],backupHours:4,gridLimit:[6,20,8,25,150,1000][i],gridVoltage:i===5?'mv':'lv',arrayOrientation:180,tilt:30,selected:0,inverterRating:[10,20,10,30,100,250][i],batteryUnit:i===5?250:i===4?12:5,inverterQty:i===5?4:1,batteryQty:null,planImage:null,packageScale:1,roofData:[{id:1,points:[[150,100],[450,100],[450,300],[150,300]],tilt:30,azimuth:180,modules:[],obstacles:[]}],load:null,logo:null,revision:0,draft:null,submitted:false};for(let r=0;r<3;r++)for(let c=0;c<8;c++)b.roofData[0].modules.push({x:170+c*26,y:120+r*42,rot:false});return b;}
const projects=Array.from({length:6},(_,i)=>initial(i)),saved=new Map();let p=projects[0];
const btn=(text,action,cls='',extra='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
const field=(key,label,type='text',suffix='',extra='')=>`<label>${label}${suffix?` <small>(${suffix})</small>`:''}<input data-field="${key}" type="${type}" value="${esc(p[key])}" ${type==='number'?'required':''} ${extra}></label>`;
const opts=(arr,value)=>arr.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('');
const select=(key,label,arr)=>`<label>${label}<select data-field="${key}">${opts(arr,p[key])}</select></label>`;
const titles=()=>[L('Project','Projekt','项目'),L('Solar','Photovoltaik','光伏'),L('Energy use','Energiebedarf','用能'),L('System','System','系统方案'),L('Review & share','Prüfen & anfragen','报告与询盘')];
function pv(){return p.scope==='storage'?0:(p.pvMode==='roof'?p.roofData.reduce((a,r)=>a+r.modules.length,0):p.count)*p.modulePower/1000;}
function unitBattery(){return Number(p.batteryUnit);}
function unitInverter(){return Number(p.inverterRating);}
function packages(){const base=p.goal==='backup'?Math.max(p.requestKWh,p.backupPower*p.backupHours):p.requestKWh;const m=Math.ceil(base/unitBattery());return [{modules:m,title:L('Starting configuration','Ausgangskonfiguration','基础配置'),reason:L('Equipment for the entered power and capacity.','Geräte für die angegebene Leistung und Kapazität.','对应输入功率和容量的设备组合。')},{modules:m+Math.max(1,Math.ceil(m/2)),title:L('More storage','Mehr Speicherkapazität','增加储能'),reason:L('More stored energy; compare the additional equipment.','Mehr gespeicherte Energie; zusätzliche Geräte im Vergleich.','增加可储存电量，比较需要多配哪些设备。')},{modules:0,title:L('Without new storage','Ohne neuen Speicher','不新增储能'),reason:L('Keep the solar or existing system as a comparison.','Photovoltaik oder Bestand als Vergleich beibehalten.','保留光伏或原系统，作为比较基准。')}];}
function system(){const q=packages()[p.selected];const bq=p.scope==='solar'?0:(p.batteryQty??q.modules);const iq=bq===0&&(p.scope==='storage'||(p.existing&&p.keepExisting))?0:p.inverterQty;return {iq,bq,kw:iq*unitInverter(),kwh:bq*unitBattery(),pv:pv()};}
function rows(){const s=system(),r=[];if(p.existing&&p.keepExisting)r.push({name:p.existingName,detail:`${n(p.existingPower)} kW`,qty:1,status:'kept',kind:'inverter'});if(pv()>0&&!p.existing)r.push({name:L('PV module · example','PV-Modul · Beispiel','光伏组件 · 示例'),detail:`${p.modulePower} Wp`,qty:p.pvMode==='roof'?p.roofData.reduce((a,r)=>a+r.modules.length,0):p.count,status:'new',kind:'solar'});if(s.iq>0&&!(p.existing&&p.keepExisting&&s.bq===0))r.push({name:p.existing&&p.keepExisting?L('Battery inverter · example','Batteriewechselrichter · Beispiel','储能逆变器 · 示例'):p.scope==='storage'?L('Storage inverter · example','Speicherwechselrichter · Beispiel','储能逆变器 · 示例'):L('Hybrid inverter · example','Hybridwechselrichter · Beispiel','混合逆变器 · 示例'),detail:`${n(unitInverter())} kW`,qty:s.iq,status:p.existing&&!p.keepExisting?'replace':'new',kind:'inverter'});if(s.bq){r.push({name:L('Battery module · example','Batteriemodul · Beispiel','电池模块 · 示例'),detail:`${n(unitBattery())} kWh`,qty:s.bq,status:'new',kind:'battery'});r.push({name:L('Control and connection set · example','Steuerungs- und Anschlussset · Beispiel','控制与连接配套 · 示例'),detail:L('Shown with this example configuration','Bestandteil dieser Beispielkonfiguration','本演示配置对应的配套'),qty:Math.max(1,s.iq),status:'new',kind:'accessory'});r.push({name:L('Metering set · example','Messset · Beispiel','计量配套 · 示例'),detail:L('At the grid connection','Am Netzanschlusspunkt','位于并网点'),qty:1,status:'new',kind:'accessory'});if(p.goal==='backup')r.push({name:L('Backup switching set · example','Umschalteinrichtung · Beispiel','备电切换配套 · 示例'),detail:L('For the selected backup loads','Für die ausgewählten Ersatzstromlasten','用于所选备电负载'),qty:1,status:'new',kind:'accessory'});}return r;}
function statusLabel(s){return s==='kept'?L('Keep','Beibehalten','保留'):s==='replace'?L('Replacement','Ersatz','替换'):L('New','Neu','新增');}
function touch(){p.revision++;p.submitted=false;}
function toast(text){clearTimeout(toastTimer);document.querySelector('#toast').textContent=text;toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4000);}
function icon(kind){if(kind==='solar')return '<svg viewBox="0 0 70 76" aria-hidden="true"><path d="M13 10h44l6 48H7z" fill="#173b4b" stroke="#456572"/><path d="M10 26h49M9 42h52M28 10l-2 48M43 10l2 48" stroke="#a7bac0"/><path d="M25 58v9h20v-9" fill="none" stroke="#78948b" stroke-width="3"/></svg>';return `<svg viewBox="0 0 70 76" aria-hidden="true"><rect x="15" y="5" width="40" height="64" rx="5" fill="#f5f8f7" stroke="#9aafa5"/><path d="M15 47h40" stroke="#b1c3b9"/><rect x="29" y="16" width="12" height="5" rx="2" fill="#0c7f73"/>${kind==='battery'?'<path d="M22 29h26M22 37h26M22 56h26" stroke="#b1c3b9"/>':'<circle cx="35" cy="34" r="6" fill="#e2eae5"/>'}<path d="M22 69v4m26-4v4" stroke="#8fa69b" stroke-width="3"/></svg>`;}
function countrySelect(){return select('country',L('Country','Land','国家'),countries.map(c=>[c,names().of(c)]).sort((a,b)=>a[1].localeCompare(b[1],lang)));}
function render(){document.documentElement.lang=lang==='de'?'de-DE':lang==='zh'?'zh-CN':'en';const s=system();document.querySelector('#app').innerHTML=`<div class="demo-bar"><strong>${L('INTERACTIVE PROTOTYPE','INTERAKTIVER PROTOTYP','交互原型')}</strong><span>${L('Example projects and equipment','Beispielprojekte und -geräte','示例项目与设备')}</span><span class="grow"></span><label>${L('Example','Beispiel','演示场景')} <select id="scene">${opts(sceneLabels().map((v,i)=>[i,v]),scene)}</select></label><label>${L('Language','Sprache','语言')} <select id="lang">${opts([['en','English'],['de','Deutsch'],['zh','中文']],lang)}</select></label></div><header class="brand-header"><div class="brand"><span class="brand-mark"></span>linker</div><div class="product-title">${L('Solution Configurator','Lösungskonfigurator','系统方案配置器')}</div><div class="actions">${btn(L('Save snapshot','Stand speichern','保存当前方案'),'save','quiet')}${btn(L('Restore','Wiederherstellen','恢复'),'restore','quiet',saved.has(scene)?'':'disabled')}</div></header><div class="workspace"><div class="project-heading"><div><div class="eyebrow">${L('Your project','Ihr Projekt','当前项目')}</div><h1>${esc(p.name)}</h1><div class="place">${esc(p.city)} · ${esc(names().of(p.country))}</div></div><span class="badge">${L('Session only','Nur diese Sitzung','仅本次会话')}</span></div><nav class="nav" aria-label="${L('Project navigation','Projektnavigation','项目导航')}">${titles().map((x,i)=>p.scope==='storage'&&i===1?'':btn(`<span class="n">${i+1}</span>${x}`,'step','',`data-value="${i}" ${step===i?'aria-current="step"':''}`)).join('')}</nav><div class="layout"><main class="main" id="main">${[projectPage,solarPage,energyPage,systemPage,reviewPage][step]()}</main><aside class="side"><div class="card"><div><div class="eyebrow">${L('Current configuration','Aktuelle Konfiguration','当前配置')}</div><h3>${esc(p.name)}</h3></div><dl>${p.scope!=='storage'?`<div><dt>${L('Solar capacity','PV-Leistung','光伏功率')}</dt><dd>${n(s.pv)} kWp</dd></div>`:''}<div><dt>${L('Storage capacity','Speicherkapazität','储能容量')}</dt><dd>${n(s.kwh)} kWh</dd></div><div><dt>${L('Inverter power','Wechselrichterleistung','逆变器功率')}</dt><dd>${n(s.kw)} kW</dd></div></dl><div class="divider"><p class="small">${L('Example equipment. Final selection requires project calculations and product checks.','Beispielgeräte. Die endgültige Auswahl erfordert Projektberechnungen und Produktprüfung.','示例设备。正式选型需完成项目计算与产品核实。')}</p>${btn(L('View parts list','Stückliste ansehen','查看设备清单'),'step','context-link','data-value="4"')}</div></div></aside></div><div class="footer-note">${L('Prototype for reviewing the planning workflow. No inquiry is sent.','Prototyp zur Prüfung des Planungsablaufs. Es wird keine Anfrage versendet.','用于评审规划流程的原型，不会发送询盘。')}</div></div>`;wireChart();}
function nextFooter(next,label){return `<div class="step-footer">${step?btn(L('Back','Zurück','返回'),'back'): '<span></span>'}${btn(label||L('Continue','Weiter','继续'),'step','primary',`data-value="${next}"`)}</div>`;}
function projectPage(){return `<div class="section-head"><div><h1>${L('What is the project?','Was ist geplant?','这次计划做什么？')}</h1><p class="sub">${L('Start with the location and what is already known.','Standort und vorhandene Angaben bilden den Ausgangspunkt.','从项目地点和已有资料开始。')}</p></div></div><section class="card"><div class="fields">${field('name',L('Project name','Projektname','项目名称'),'text','','required')}${countrySelect()}${field('city',L('Town or site','Ort oder Standort','城市或地点'),'text','','required')}${select('scope',L('Planned system','Geplantes System','计划系统'),[['both',L('Solar and storage','Photovoltaik und Speicher','光伏与储能')],['solar',L('Solar','Photovoltaik','光伏')],['storage',L('Storage','Speicher','储能')]])}<div class="wide">${select('goal',L('Main purpose','Hauptziel','主要目的'),[['self',L('Use more solar energy on site','Mehr Solarstrom selbst nutzen','提高光伏自用')],['backup',L('Supply selected loads during an outage','Ausgewählte Verbraucher bei Stromausfall versorgen','停电时维持指定负载')],['peak',L('Reduce peak grid demand','Lastspitzen am Netzanschluss senken','降低电网取电峰值')]])}</div><label class="check wide"><input type="checkbox" data-field="existing" ${p.existing?'checked':''}>${L('There is an existing system','Eine Anlage ist bereits vorhanden','现场已有系统')}</label>${p.existing?`${field('existingName',L('Existing inverter / system','Vorhandener Wechselrichter / Anlage','已有逆变器或系统'))}${field('existingPower',L('Existing inverter power','Leistung des vorhandenen Wechselrichters','已有逆变器功率'),'number','kW','min="0.1" step="0.1"')}<label class="check wide"><input type="checkbox" data-field="keepExisting" ${p.keepExisting?'checked':''}>${L('Keep the existing inverter','Vorhandenen Wechselrichter beibehalten','保留已有逆变器')}</label>`:''}</div></section>${scene===5?`<section class="card"><h2>${L('Grid connection','Netzanschluss','并网条件')}</h2><div class="fields" style="margin-top:18px">${select('gridVoltage',L('Connection level','Spannungsebene','并网电压等级'),[['lv',L('Low voltage','Niederspannung','低压')],['mv',L('Medium voltage','Mittelspannung','中压')]])}${field('gridLimit',L('Grid import limit','Netzbezugsgrenze','最大取电功率'),'number','kW','min="0" step="1"')}</div></section>`:''}${nextFooter(p.scope==='storage'?2:1,p.scope==='storage'?L('Continue with storage','Weiter zum Speicher','继续储能配置'):L('Continue with solar','Weiter zur Photovoltaik','继续光伏配置'))}`;}
function solarPage(){return `<div class="section-head"><div><h1>${L('Define the solar installation','Photovoltaikanlage festlegen','确定光伏部分')}</h1><p class="sub">${L('A roof layout or the module details can provide the starting point.','Dachbelegung oder bekannte Moduldaten können als Grundlage dienen.','已有组件资料可直接使用，也可以在屋顶上确定布局。')}</p></div></div><div class="option-row" style="margin-bottom:20px">${btn(`${L('Use module details','Moduldaten verwenden','输入已有组件')}<span>${L('Quantity, power and orientation','Anzahl, Leistung und Ausrichtung','数量、功率和朝向')}</span>`,'pvMode',`option-card ${p.pvMode==='known'?'active':''}`,'data-value="known"')}${btn(`${L('Place modules on the roof','Module auf dem Dach anordnen','在屋顶上布置')}<span>${L('Roof outline, obstacles and layout','Dachflächen, Hindernisse und Belegung','屋面轮廓、障碍和组件布局')}</span>`,'pvMode',`option-card ${p.pvMode==='roof'?'active':''}`,'data-value="roof"')}</div><section class="card"><div class="fields">${select('modulePower',L('Example PV module','Beispiel-PV-Modul','示例组件'),[[450,'450 Wp'],[500,'500 Wp']])}${p.pvMode==='known'?field('count',L('Number of modules','Anzahl der Module','组件数量'),'number','','min="1" step="1"'): `<div><label>${L('Placed modules','Platzierte Module','已放置组件')}</label><div class="metrics"><div class="metric"><strong>${p.roofData.reduce((a,r)=>a+r.modules.length,0)}</strong></div></div></div>`}${p.pvMode==='known'?`${field('arrayOrientation',L('Azimuth (north = 0°)','Azimut (Nord = 0°)','方位角（北为0°）'),'number','°','min="0" max="359"')}${field('tilt',L('Roof pitch','Dachneigung','屋面倾角'),'number','°','min="0" max="90"')}`:''}</div>${p.pvMode==='roof'?`<div style="margin-top:20px">${miniRoof()}${btn(L('Open roof layout','Dachbelegung öffnen','编辑屋顶与组件'),'roof','primary','style="margin-top:16px"')}</div>`:''}<div class="metrics"><div class="metric"><strong>${n(pv())} kWp</strong><span>${L('Solar capacity','PV-Leistung','光伏总功率')}</span></div></div></section>${nextFooter(2,L('Continue with energy use','Weiter zum Energiebedarf','继续用能分析'))}`;}
function energyPage(){return `<div class="section-head"><div><h1>${L('What should the system do?','Was soll die Anlage leisten?','系统需要满足什么？')}</h1><p class="sub">${L('The purpose determines which information matters.','Das Ziel bestimmt, welche Angaben benötigt werden.','根据用途补充相关资料。')}</p></div></div><section class="card"><div class="fields">${select('goal',L('Purpose','Ziel','用途'),[['self',L('Use more solar on site','Mehr Solarstrom selbst nutzen','提高光伏自用')],['backup',L('Backup supply','Ersatzstromversorgung','备电')],['peak',L('Reduce peak demand','Lastspitzen senken','削峰')]])}${field('annual',L('Annual electricity use','Jährlicher Stromverbrauch','年用电量'),'number','kWh','min="1" step="1"')}${select('profile',L('Typical use','Typische Nutzung','通常何时用电'),[['evening',L('Mostly mornings and evenings','Überwiegend morgens und abends','主要早晚')],['day',L('People on site during the day','Tagsüber genutzt','主要白天')],['business',L('Business hours, weekdays','Werktags zu Geschäftszeiten','工作日营业时段')],['continuous',L('Throughout the day and night','Durchgehend, Tag und Nacht','全天持续')]])}${p.goal==='peak'?field('gridLimit',L('Target grid import limit','Gewünschte Netzbezugsgrenze','目标取电上限'),'number','kW','min="0" step="0.1"'):''}</div>${p.goal==='backup'?`<div class="note">${L('Backup sizing starts with the loads that must keep running.','Die Ersatzstromauslegung beginnt bei den Verbrauchern, die weiterlaufen sollen.','备电从需要持续运行的负载开始。')}</div><div class="fields">${field('backupPower',L('Backup load','Ersatzstromlast','备电负载功率'),'number','kW','min="0.1" step="0.1"')}${field('backupHours',L('Required duration','Gewünschte Dauer','需要维持多久'),'number','h','min="0.1" step="0.1"')}</div><div class="metrics"><div class="metric"><strong>${n(p.backupPower*p.backupHours)} kWh</strong><span>${L('Load energy before system losses','Lastenergie vor Systemverlusten','负载所需电量，未计系统损耗')}</span></div></div>`:''}</section><section class="card chart-card"><div class="section-head"><div><h2>${p.load?L('Imported electricity use','Importierter Stromverbrauch','已导入用电曲线'):L('Typical day','Typischer Tagesverlauf','典型一天')}</h2><p class="small sub">${p.load?`${esc(p.load.first)} → ${esc(p.load.last)} · ${p.load.values.length} ${L('readings','Messwerte','个数据点')}`:L('Illustrative profile, scaled to the daily average.','Beispielprofil, auf den Tagesdurchschnitt skaliert.','演示日曲线，按日均用电量缩放。')}</p></div><div class="actions">${btn(L('Import CSV','CSV importieren','导入CSV'),'csv')}${p.load?btn(L('Use typical day','Typischen Tag verwenden','使用典型日'),'clearLoad','quiet'):''}</div></div>${chart()}${peakSummary()}<details><summary>${L('View readings','Messwerte ansehen','查看数据')}</summary>${loadTable()}</details></section><details class="card"><summary>${L('Required power and capacity already known?','Leistung und Kapazität bereits bekannt?','已知道所需功率和容量？')}</summary><p class="sub small">${L('These values define the example configurations. They can be adjusted when comparing equipment.','Diese Werte bestimmen die Beispielkonfigurationen und lassen sich beim Gerätevergleich anpassen.','这些数值用于构成演示方案，可在比较设备时调整。')}</p><div class="fields" style="margin-top:20px">${field('requestKW',L('Inverter power','Wechselrichterleistung','逆变器功率'),'number','kW','min="1" step="1"')}${field('requestKWh',L('Storage capacity to compare','Zu vergleichende Speicherkapazität','要比较的储能容量'),'number','kWh','min="0" step="1"')}</div></details>${nextFooter(3,L('Compare systems','Systeme vergleichen','比较系统方案'))}`;}
function peakSummary(){if(p.goal!=='peak')return '';const a=profiles(),peak=a.reduce((max,v)=>Math.max(max,v),0),excess=a.reduce((s,v)=>s+Math.max(0,v-p.gridLimit),0)*(p.load?p.load.interval/60:1);return `<div class="metrics"><div class="metric"><strong>${n(peak)} kW</strong><span>${L('Peak in this profile','Spitze in diesem Lastprofil','此曲线的最高负荷')}</span></div><div class="metric"><strong>${n(Math.max(0,peak-p.gridLimit))} kW</strong><span>${L('Above the target','Über dem Zielwert','超过目标上限')}</span></div><div class="metric"><strong>${n(excess)} kWh</strong><span>${L('Energy above target in this period','Energie über dem Zielwert im Zeitraum','该时段超过上限的电量')}</span></div></div><p class="small sub">${L('These are load requirements, not a prediction of battery performance.','Dies sind Lastanforderungen, keine Prognose der Batterieleistung.','这些是负载需求，不是电池运行效果预测。')}</p>`;}
function profiles(){if(p.load)return p.load.values;const shapes={evening:[.4,.3,.3,.3,.4,.6,1.3,1.7,1,.6,.5,.5,.7,.6,.5,.6,.9,1.6,2,2.2,1.8,1.3,.8,.5],day:[.4,.3,.3,.3,.4,.6,1,1.2,1.3,1.3,1.4,1.5,1.5,1.3,1.2,1.3,1.4,1.6,1.5,1.3,1,.7,.6,.4],business:[.3,.3,.3,.3,.3,.4,.6,1.2,2,2.2,2.2,2.1,1.8,2.2,2.3,2.2,2,1.4,.8,.5,.4,.4,.3,.3],continuous:Array(24).fill(1)};const a=shapes[p.profile],sum=a.reduce((s,v)=>s+v,0);return a.map(v=>v/sum*p.annual/365);}
function chart(){const a=profiles(),max=a.reduce((max,v)=>Math.max(max,v),1),sample=a.length>240?a.filter((_,i)=>i%Math.ceil(a.length/240)===0):a;const path=sample.map((v,i)=>`${i?'L':'M'}${42+i*670/Math.max(1,sample.length-1)},${200-v/max*160}`).join(' ');return `<div class="chart-tip" id="chartTip">${L('Electricity demand','Strombedarf','用电功率')} · kW</div><svg class="chart" viewBox="0 0 760 245" role="img" tabindex="0" aria-label="${L('Electricity demand. Arrow keys inspect readings.','Strombedarf. Pfeiltasten zeigen Messwerte.','用电功率曲线，方向键查看读数。')}">${[0,.5,1].map(f=>`<line x1="42" x2="712" y1="${200-160*f}" y2="${200-160*f}" stroke="#e0e8e3"/><text x="34" y="${204-160*f}" text-anchor="end">${n(max*f)}</text>`).join('')}<path d="${path}" fill="none" stroke="#087f5b" stroke-width="2.5"/><text x="42" y="228">${p.load?esc(p.load.labels[0]):'00:00'}</text><text x="712" y="228" text-anchor="end">${p.load?esc(p.load.labels.at(-1)):'23:00'}</text><line id="crosshair" x1="42" x2="42" y1="32" y2="204" stroke="#647b70" opacity="0"/><circle id="chartDot" cx="42" cy="200" r="5" fill="#087f5b" stroke="white" stroke-width="2" opacity="0"/></svg>`;}
function wireChart(){const svg=document.querySelector('.chart');if(!svg)return;let idx=0;const a=profiles();function show(i){idx=Math.min(a.length-1,Math.max(0,i));const x=42+idx*670/Math.max(1,a.length-1),y=200-a[idx]/a.reduce((max,v)=>Math.max(max,v),1)*160;svg.querySelector('#crosshair').setAttribute('x1',x);svg.querySelector('#crosshair').setAttribute('x2',x);svg.querySelector('#crosshair').setAttribute('opacity',1);const dot=svg.querySelector('#chartDot');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('opacity',1);document.querySelector('#chartTip').textContent=`${p.load?p.load.labels[idx]:String(idx).padStart(2,'0')+':00'} · ${n(a[idx],2)} kW`;}svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();show(Math.round(((e.clientX-r.left)/r.width*760-42)/670*(a.length-1)));});svg.addEventListener('focus',()=>show(idx));svg.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();show(idx+(e.key==='ArrowRight'?1:-1));}});}
function loadTable(){const a=profiles(),start=csvPage*48,end=Math.min(start+48,a.length);return `<div class="table-wrap"><table><thead><tr><th>${L('Time','Zeit','时间')}</th><th class="num">kW</th></tr></thead><tbody>${a.slice(start,end).map((v,i)=>`<tr><td>${esc(p.load?p.load.labels[start+i]:String(start+i).padStart(2,'0')+':00')}</td><td class="num">${n(v,2)}</td></tr>`).join('')}</tbody></table></div>${a.length>48?`<div class="actions">${btn('←','csvPage','',`data-value="${csvPage-1}" ${csvPage===0?'disabled':''}`)}<span>${start+1}–${end} / ${a.length}</span>${btn('→','csvPage','',`data-value="${csvPage+1}" ${end===a.length?'disabled':''}`)}</div>`:''}`;}
function systemPage(){const s=system();return `<div class="section-head"><div><h1>${L('A system for this project','Ein System für dieses Projekt','这个项目的系统方案')}</h1><p class="sub">${L('Compare the equipment, then adjust the configuration.','Geräte vergleichen und die Konfiguration anpassen.','先比较设备组合，再调整具体配置。')}</p></div>${btn(L('Save a comparison','Vergleichsstand sichern','保留比较版本'),'compareSave')}</div><div class="comparison">${packages().map((q,i)=>p.scope==='solar'&&i!==2?'':`<article class="package ${p.selected===i?'chosen':''}"><h3>${q.title}</h3><div class="capacity">${n(p.scope==='solar'?0:q.modules*unitBattery())} <small>kWh</small></div><p>${q.reason}</p>${btn(p.selected===i?L('Selected','Ausgewählt','当前选用'):L('Use this configuration','Diese Konfiguration verwenden','选用此方案'),'package',p.selected===i?'primary':'',`data-value="${i}"`)}</article>`).join('')}</div><section class="card" style="margin-top:20px"><h2>${L('Selected equipment','Ausgewählte Geräte','所选设备')}</h2><div class="system-line">${pv()>0?`<div class="system-node">${L('Solar','Photovoltaik','光伏')}<small>${n(pv())} kWp</small></div><span class="connector">↔</span>`:''}<div class="system-node">${p.existing&&p.keepExisting?L('Existing system','Bestandsanlage','原有系统'):L('Inverter','Wechselrichter','逆变器')}<small>${n(p.existing&&p.keepExisting?p.existingPower:s.kw)} kW</small></div><span class="connector">↔</span><div class="system-node">${L('Storage','Speicher','储能')}<small>${n(s.kwh)} kWh</small></div></div><div class="fields ${s.iq===0?'hidden':''}">${select('inverterRating',L('Example inverter','Beispiel-Wechselrichter','示例逆变器'),[5,10,15,20,30,50,100,250,500].map(v=>[v,`${v} kW`]))}${select('batteryUnit',L('Example battery module','Beispiel-Batteriemodul','示例电池模块'),[5,10,12,50,250].map(v=>[v,`${v} kWh`]))}${field('inverterQty',L('New inverter quantity','Anzahl neuer Wechselrichter','新增逆变器数量'),'number','','min="1" step="1"')}<label>${L('Battery module quantity','Anzahl der Batteriemodule','电池模块数量')}<input type="number" data-field="batteryQty" min="0" step="1" value="${s.bq}"></label></div><div class="metrics"><div class="metric"><strong>${n(s.kw)} kW</strong><span>${L('New inverter power','Neue Wechselrichterleistung','新增逆变器总功率')}</span></div><div class="metric"><strong>${n(s.kwh)} kWh</strong><span>${L('Example storage capacity','Beispiel-Speicherkapazität','演示储能总容量')}</span></div></div>${p.goal==='backup'?`<div class="note">${L('Backup load energy','Energie für die Ersatzstromlast','备电负载所需电量')}: ${n(p.backupPower)} kW × ${n(p.backupHours)} h = ${n(p.backupPower*p.backupHours)} kWh. ${L('Output power, losses and switching remain part of the engineering design.','Ausgangsleistung, Verluste und Umschaltung gehören zur technischen Auslegung.','输出功率、损耗与切换仍需正式工程校核。')}</div>`:''}${rows().map(r=>`<div class="equipment">${icon(r.kind)}<div><h3>${esc(r.name)}</h3><p>${esc(r.detail)}</p><span class="badge">${statusLabel(r.status)}</span></div><strong>× ${r.qty}</strong></div>`).join('')}<details><summary>${L('Selection basis and documents','Auswahlgrundlage und Unterlagen','选型依据与资料')}</summary><p>${L('This prototype uses illustrative equipment capacities and quantities. It does not certify inverter/battery compatibility or grid suitability.','Dieser Prototyp verwendet beispielhafte Geräteleistungen und Stückzahlen. Er bestätigt weder Wechselrichter-Batterie-Kompatibilität noch Netzkonformität.','原型使用演示设备参数与数量，不构成逆变器电池兼容或并网适用性放行。')}</p><p>${L('A final design includes module/string checks, battery pairing, grid requirements and the accessories needed for the chosen operating mode.','Zur endgültigen Auslegung gehören Modul- und Stringprüfung, Batteriefreigabe, Netzanforderungen und das für die Betriebsart erforderliche Zubehör.','正式设计需包含组件与配串核对、电池配对、并网要求及所选运行方式需要的配套。')}</p><div class="source-links"><a href="https://solar-planit.com/" target="_blank" rel="noopener">Solar-Planit</a><a href="https://www.sunnydesignweb.com/" target="_blank" rel="noopener">Sunny Design</a><a function modal(title,body,footer=''){const d=document.querySelector('#modal');d.innerHTML=`<div class="dialog-head"><h2>${title}</h2>${btn(L('Close','Schließen','关闭'),'close','quiet')}</div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-foot">${footer}</div>`:''}`;if(!d.open)d.showModal();}
function csvParser(text){let rows=[],row=[],s='',quoted=false;const first=text.split(/\r?\n/)[0],delimiter=first.includes(';')?';':first.includes('\t')?'\t':',';for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){s+='"';i++;}else quoted=!quoted;}else if(c===delimiter&&!quoted){row.push(s);s='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(s);if(row.some(v=>v.trim()))rows.push(row);row=[];s='';}else s+=c;}row.push(s);if(row.some(v=>v.trim()))rows.push(row);return rows;}
function csvModal(){modal(L('Import electricity use','Stromverbrauch importieren','导入用电曲线'),`<p class="sub">${L('The file stays in this browser. Columns and units can be checked before use.','Die Datei bleibt in diesem Browser. Spalten und Einheiten lassen sich vor der Übernahme prüfen.','文件仅在浏览器内读取，应用前可检查列与单位。')}</p><div class="actions" style="margin:20px 0"><label class="file-label">${L('Choose CSV','CSV auswählen','选择CSV')}<input type="file" id="csvFile" accept=".csv,text/csv"></label>${btn(L('Try an example file','Beispieldatei verwenden','使用示例文件'),'sampleCSV')}</div><div id="csvPreview"></div>`);}
function showCSV(){const h=importRows[0];document.querySelector('#csvPreview').innerHTML=`<div class="fields"><label>${L('Time column','Zeitspalte','时间列')}<select id="timeCol">${opts(h.map((v,i)=>[i,v]),0)}</select></label><label>${L('Demand column','Verbrauchsspalte','用电列')}<select id="valueCol">${opts(h.map((v,i)=>[i,v]),1)}</select></label><label>${L('Unit','Einheit','单位')}<select id="csvUnit">${opts([['kW','kW'],['W','W'],['kWh','kWh'],['Wh','Wh']],'kW')}</select></label><label>${L('Interval','Zeitintervall','间隔')} <small>min</small><input id="csvInterval" type="number" min="1" value="15"></label></div><div class="table-wrap" style="margin:20px 0"><table><thead><tr>${h.map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${importRows.slice(1,6).map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">${importRows.length-1} ${L('readings','Messwerte','个读数')}</p><div class="inline-error" id="csvError" role="alert"></div>${btn(L('Use these readings','Messwerte übernehmen','应用这些读数'),'applyCSV','primary')}`;}
function applyCSV(){const tc=+document.querySelector('#timeCol').value,vc=+document.querySelector('#valueCol').value,unit=document.querySelector('#csvUnit').value,interval=+document.querySelector('#csvInterval').value;let data=importRows.slice(1),bad=data.findIndex(r=>!r[tc]||!r[vc]?.trim()||!Number.isFinite(Number(r[vc].replace(',','.')))||Number(r[vc].replace(',','.'))<0);if(bad>=0||tc===vc||!(interval>0)){document.querySelector('#csvError').textContent=L('Check the selected columns, interval and numeric values.','Bitte ausgewählte Spalten, Zeitintervall und Zahlenwerte prüfen.','请检查所选列、时间间隔和数值。');return;}const values=data.map(r=>Number(r[vc].replace(',','.'))*(unit==='W'||unit==='Wh'?.001:1)*(unit==='kWh'||unit==='Wh'?60/interval:1));p.load={values,labels:data.map(r=>r[tc]),first:data[0][tc],last:data.at(-1)[tc],interval};csvPage=0;touch();document.querySelector('#modal').close();render();toast(L('Readings added to this project','Messwerte dem Projekt hinzugefügt','读数已加入当前项目'));}
// Roof layout uses metres at 20 drawing units per metre; it is an editable example plan, not a surveyed site.
let roofIndex=0,roofTool='select',roofSelection=null,roofDraft=[],roofUndo=[],view3d=false,drag=null;
const activeRoof=()=>p.roofData[roofIndex];
function rememberRoof(){roofUndo.push(copy(p.roofData));}
function inside(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function panelFits(m,r){const w=m.rot?36:22,h=m.rot?22:36,pts=[[m.x,m.y],[m.x+w,m.y],[m.x+w,m.y+h],[m.x,m.y+h]];return pts.every(pt=>inside(pt,r.points))&&!r.obstacles.some(o=>m.x<o.x+o.w&&m.x+w>o.x&&m.y<o.y+o.h&&m.y+h>o.y);}
function panelAvailable(m,r,index){const w=m.rot?36:22,h=m.rot?22:36;return panelFits(m,r)&&!r.modules.some((o,i)=>i!==index&&m.x<o.x+(o.rot?36:22)&&m.x+w>o.x&&m.y<o.y+(o.rot?22:36)&&m.y+h>o.y);}

function roofModal(){const r=activeRoof(),x=r.points.map(v=>v[0]),y=r.points.map(v=>v[1]),d=document.querySelector('#roofModal');d.innerHTML=`<div class="dialog-head"><div><div class="eyebrow">${L('Site detail','Standortdetails','现场细节')}</div><h2>${L('Roof and module layout','Dach und Modulbelegung','屋顶与组件布局')}</h2></div>${btn(L('Use this layout','Belegung übernehmen','应用当前布局'),'roofClose','primary')}</div><div class="roof-layout"><div><div class="roof-tools">${[['select',L('Select / move','Auswählen / bewegen','选择／移动')],['roof',L('Draw roof','Dach zeichnen','画屋面')],['panels',L('Place modules','Module platzieren','铺组件')],['obstacle',L('Obstacle','Hindernis','障碍')],['erase',L('Remove','Entfernen','删除')]].map(([v,t])=>btn(t,'roofTool',roofTool===v?'active':'',`data-value="${v}" ${view3d?'disabled':''}`)).join('')}${btn(L('Undo','Rückgängig','撤销'),'roofUndo','',roofUndo.length?'':'disabled')}${btn(view3d?'2D':L('Angled preview','Schrägansicht','斜视示意'),'roofView')}</div><div class="roof-list">${p.roofData.map((r,i)=>btn(`${L('Roof','Dach','屋面')} ${i+1}`,'roofPick',roofIndex===i?'active':'',`data-value="${i}"`)).join('')}</div><div class="roof-board"><svg id="roofSvg" tabindex="0" role="img" aria-label="${L('Editable roof plan','Bearbeitbarer Dachplan','可编辑屋顶平面图')}" viewBox="0 0 800 470">${svgScene(true)}</svg><div class="map-caption">${L('Example plan · grid 1 m','Beispielplan · Raster 1 m','示例底图 · 网格1米')}</div></div><div class="roof-help">${view3d?L('Spatial preview of the same layout. Editing is available in 2D.','Räumliche Vorschau derselben Belegung. Bearbeitung in 2D.','同一布局的立体示意，可在2D中编辑。'):roofHelp()}</div>${roofDraft.length?btn(L('Finish outline','Umriss abschließen','完成轮廓'),'finishRoof','primary',roofDraft.length>=3?'':'disabled'):''}</div><aside class="roof-props"><label class="file-label">${L('Plan image','Planbild','图纸图片')}<input id="planFile" type="file" accept="image/png,image/jpeg,image/webp"></label>${p.planImage?btn(L('Example background','Beispielhinter function roofPoint(e){const svg=document.querySelector('#roofSvg'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [Math.round(q.x/5)*5,Math.round(q.y/5)*5];}

function placeModules(x1,y1,x2,y2){const r=activeRoof();for(let y=Math.min(y1,y2)+4;y+36<Math.max(y1,y2);y+=40)for(let x=Math.min(x1,x2)+4;x+22<Math.max(x1,x2);x+=26){const m={x,y,rot:false};if(panelFits(m,r)&&!r.modules.some(o=>x<o.x+(o.rot?36:22)&&x+22>o.x&&y<o.y+(o.rot?22:36)&&y+36>o.y))r.modules.push(m);}}
function wireRoof(){const svg=document.querySelector('#roofSvg');svg.addEventListener('pointerdown',e=>{if(view3d)return;const pt=roofPoint(e),t=e.target;if(roofTool==='roof'){roofDraft.push(pt);roofModal();return;}if(t.hasAttribute('data-owner'))roofIndex=+t.dataset.owner;const r=activeRoof();if(t.hasAttribute('data-panel'))roofSelection={kind:'panel',i:+t.dataset.panel};else if(t.hasAttribute('data-obstacle'))roofSelection={kind:'obstacle',i:+t.dataset.obstacle};else if(t.hasAttribute('data-vertex'))roofSelection={kind:'vertex',i:+t.dataset.vertex};else if(t.hasAttribute('data-roof-id')){roofIndex=+t.dataset.roofId;roofSelection={kind:'roof'};}else roofSelection=null;if(roofTool==='erase'){removeSelected();return;}rememberRoof();drag={start:pt,last:pt,original:copy(activeRoof()),selection:roofSelection};svg.setPointerCapture(e.pointerId);redrawRoof();});svg.addEventListener('pointermove',e=>{if(!drag)return;const pt=roofPoint(e),dx=pt[0]-drag.start[0],dy=pt[1]-drag.start[1],r=activeRoof(),o=drag.original,s=drag.selection;if(roofTool==='select'&&s){if(s.kind==='vertex')r.points[s.i]=[o.points[s.i][0]+dx,o.points[s.i][1]+dy];if(s.kind==='panel'){const m={...o.modules[s.i],x:o.modules[s.i].x+dx,y:o.modules[s.i].y+dy};if(panelAvailable(m,r,s.i))r.modules[s.i]=m;}if(s.kind==='obstacle')r.obstacles[s.i]={...o.obstacles[s.i],x:o.obstacles[s.i].x+dx,y:o.obstacles[s.i].y+dy};if(s.kind==='roof'){r.points=o.points.map(v=>[v[0]+dx,v[1]+dy]);r.modules=o.modules.map(v=>({...v,x:v.x+dx,y:v.y+dy}));r.obstacles=o.obstacles.map(v=>({...v,x:v.x+dx,y:v.y+dy}));}}drag.last=pt;redrawRoof();if(roofTool==='panels'||roofTool==='obstacle'){svg.insertAdjacentHTML('beforeend',`<rect x="${Math.min(pt[0],drag.start[0])}" y="${Math.min(pt[1],drag.start[1])}" width="${Math.abs(dx)}" height="${Math.abs(dy)}" fill="#0c7f7320" stroke="#0c7f73" pointer-events="none"/>`);}});svg.addEventListener('pointerup',e=>{if(!drag)return;const r=activeRoof(),pt=roofPoint(e);if(roofTool==='panels')placeModules(...drag.start,...pt);if(roofTool==='obstacle'&&Math.abs(pt[0]-drag.start[0])>5&&Math.abs(pt[1]-drag.start[1])>5)r.obstacles.push({x:Math.min(pt[0],drag.start[0]),y:Math.min(pt[1],drag.start[1]),w:Math.abs(pt[0]-drag.start[0]),h:Math.abs(pt[1]-drag.start[1])});r.modules=r.modules.filter(m=>panelFits(m,r));if(r.modules.length!==drag.original.modules.length)roofSelection=null;const changed=JSON.stringify(r)!==JSON.stringify(drag.original);drag=null;if(changed)touch();else roofUndo.pop();roofModal();});svg.addEventListener('keydown',e=>{const moves={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]};if(moves[e.key]){e.preventDefault();nudge(...moves[e.key]);}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();}else if(e.key==='Escape'){roofDraft=[];roofTool='select';roofModal();}});}
function removeSelected(){if(!roofSelection)return;rememberRoof();const r=activeRoof(),s=roofSelection;if(s.kind==='panel')r.modules.splice(s.i,1);if(s.kind==='obstacle')r.obstacles.splice(s.i,1);if(s.kind==='vertex'&&r.points.length>3){r.points.splice(s.i,1);r.modules=r.modules.filter(m=>panelFits(m,r));}if(s.kind==='roof'&&p.roofData.length>1){p.roofData.splice(roofIndex,1);roofIndex=0;}roofSelection=null;touch();roofModal();}
function nudge(dx,dy){if(!roofSelection)return;rememberRoof();const r=activeRoof(),s=roofSelection;if(s.kind==='panel'){const m={...r.modules[s.i],x:r.modules[s.i].x+dx,y:r.modules[s.i].y+dy};if(panelAvailable(m,r,s.i))r.modules[s.i]=m;}else if(s.kind==='obstacle'){r.obstacles[s.i].x+=dx;r.obstacles[s.i].y+=dy;r.modules=r.modules.filter(m=>panelFits(m,r));}else if(s.kind==='vertex'){r.points[s.i][0]+=dx;r.points[s.i][1]+=dy;r.modules=r.modules.filter(m=>panelFits(m,r));}else{r.points=r.points.map(v=>[v[0]+dx,v[1]+dy]);for(const o of [...r.modules,...r.obstacles]){o.x+=dx;o.y+=dy;}}touch();roofModal();}

});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){if(!t.checkValidity())return;p[t.dataset.field]=t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value;touch();}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='lang'){lang=t.value;render();return;}if(t.id==='scene'){scene=+t.value;p=projects[scene];step=0;comparison=null;csvPage=0;render();return;}if(t.dataset.field){if(!t.reportValidity())return;p[t.dataset.field]=t.type==='checkbox'?t.checked:t.type==='number'||t.dataset.field==='modulePower'?Number(t.value):t.value;if(t.dataset.field==='scope'){p.selected=p.scope==='solar'?2:0;p.batteryQty=null;}if(t.dataset.field==='batteryQty'&&p.batteryQty>0&&p.selected===2)p.selected=0;if(['requestKW','inverterRating'].includes(t.dataset.field))p.inverterQty=Math.max(1,Math.ceil(p.requestKW/unitInverter()));if(['requestKWh','backupHours','backupPower','goal','batteryUnit'].includes(t.dataset.field))p.batteryQty=null;render();return;}if(t.id==='roofObject'){const [kind,index]=t.value.split(':');roofSelection=!kind?null:kind==='roof'?{kind}:{kind,i:Number(index)};roofModal();return;}if(t.dataset.roofProp){if(!t.reportValidity())return;rememberRoof();const r=activeRoof(),key=t.dataset.roofProp,value=+t.value;if(key==='width'||key==='depth'){const axis=key==='width'?0:1,vals=r.points.map(v=>v[axis]),min=Math.min(...vals),ratio=value*20/(Math.max(...vals)-min);r.points=r.points.map(pt=>pt.map((v,i)=>i===axis?min+(v-min)*ratio:v));r.modules=r.modules.filter(m=>panelFits(m,r));roofSelection=null;}else r[key]=value;touch();roofModal();return;}if(t.id==='csvFile'&&t.files.length){const text=await t.files[0].text();importRows=csvParser(text.replace(/^﻿/,''));if(importRows.length<2){toast(L('A header and data rows are needed','Kopfzeile und Datenzeilen werden benötigt','需要表头和数据行'));return;}showCSV();}if(t.id==='planFile'&&t.files.length){const reader=new FileReader();reader.onload=()=>{p.planImage=reader.result;touch();roofModal();};reader.readAsDataURL(t.files[0]);}if(t.id==='logoFile'&&t.files.length){const reader=new FileReader();reader.onload=()=>{p.logo=reader.result;render();};reader.readAsDataURL(t.files[0]);}});
document.querySelector('#roofModal').addEventListener('close',render);
render();
</script></body></html>
