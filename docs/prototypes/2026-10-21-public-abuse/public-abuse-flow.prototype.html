<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linker 垃圾留言处理 · 一步一步看</title><style>html{color-scheme:light dark}body{margin:0;padding:24px;background:light-dark(#fff,#18241f)}main{max-width:760px;margin:auto}@media(max-width:500px){body{padding:12px}}</style></head><body><main>
<div id="linker-simple-story">
  <style>
    #linker-simple-story { color-scheme:light dark; --story-ink:light-dark(#183d34,#e7efe9); --story-dim:light-dark(#52675f,#b6c7be); --story-paper:light-dark(#fff,#21302a); --story-wash:light-dark(#f3f5ef,#18241f); --story-line:light-dark(#dbe5dc,#43564a); --story-green:light-dark(#087d6c,#82d5c0); --story-on-green:light-dark(#fff,#142d24); --story-tint:light-dark(#eaf4ee,#2b4134); font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--story-ink); }
    #linker-simple-story * { box-sizing:border-box; }
    #linker-simple-story h2,#linker-simple-story h3,#linker-simple-story p { margin:0; font-size:inherit; font-weight:400; }
    #linker-simple-story h2,#linker-simple-story h3,#linker-simple-story strong { font-weight:500; }
    #linker-simple-story button,#linker-simple-story input { font:inherit; }
    #linker-simple-story .story-intro { padding-right:90px; margin-bottom:16px; }
    #linker-simple-story .story-intro p { margin-top:5px; color:var(--story-dim); }
    #linker-simple-story .story-location { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--story-dim); margin-bottom:8px; }
    #linker-simple-story .story-frame { background:var(--story-wash); border:1px solid var(--story-line); border-radius:12px; overflow:hidden; }
    #linker-simple-story .story-chrome { background:var(--story-paper); border-bottom:1px solid var(--story-line); padding:12px 18px; display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:space-between; }
    #linker-simple-story .story-body { padding:20px; }
    #linker-simple-story .story-body h3 { margin-bottom:15px; }
    #linker-simple-story .story-message { background:var(--story-paper); padding:18px; border-radius:8px; overflow-wrap:anywhere; }
    #linker-simple-story .story-message p+p { margin-top:12px; }
    #linker-simple-story .story-dim { color:var(--story-dim); }
    #linker-simple-story .story-quote { border-left:2px solid var(--story-line); padding-left:12px; white-space:pre-wrap; }
    #linker-simple-story .story-note { margin-top:14px; padding:12px 14px; background:var(--story-tint); border-radius:8px; }
    #linker-simple-story .story-outcome { margin:16px 0; }
    #linker-simple-story .story-outcome p { margin-top:5px; }
    #linker-simple-story .story-action { display:block; width:100%; border:0; border-radius:9px; padding:14px 18px; background:var(--story-green); color:var(--story-on-green); text-align:center; font-weight:500; }
    #linker-simple-story .story-check { display:flex; gap:12px; align-items:center; justify-content:center; }
    #linker-simple-story .story-check input { width:24px; height:24px; flex:none; accent-color:var(--story-green); }
    #linker-simple-story .story-navigation { margin-top:12px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    #linker-simple-story .story-back { border:0; padding:6px 0; background:transparent; color:var(--story-dim); }
    #linker-simple-story .story-back:disabled { visibility:hidden; }
    #linker-simple-story .story-status { color:var(--story-dim); }
    #linker-simple-story .story-footer { margin-top:16px; border-top:1px solid var(--story-line); padding-top:12px; color:var(--story-dim); }
    #linker-simple-story [hidden] { display:none!important; }
    @media(max-width:500px) { #linker-simple-story .story-intro { padding-right:0; } #linker-simple-story .story-body { padding:14px; } #linker-simple-story .story-message { padding:14px; } }
  </style>
  <div class="story-intro"><h2>这封垃圾邮件，网站该怎么处理？</h2><p>按绿色按钮往下看。每次只走一步，全部用中文讲解。</p></div>
  <div class="story-location"><span class="story-chapter"></span><span class="story-count"></span></div>
  <section class="story-frame" aria-label="当前演示画面"><div class="story-chrome"><strong class="story-role"></strong><span class="story-dim">模拟画面</span></div><div class="story-body" aria-live="polite"></div></section>
  <div class="story-outcome" aria-live="polite"></div>
  <button type="button" class="story-action cursor-interaction"></button>
  <label class="story-action story-check cursor-interaction" hidden><input type="checkbox" aria-label="确认您是真人，继续演示"><span>确认您是真人 · 点这里模拟勾选</span></label>
  <div class="story-navigation"><button type="button" class="story-back cursor-interaction">← 上一步</button><span class="story-status"></span></div>
  <p class="story-footer">中文流程讲解，不是最终网站界面。所有发送、验证和识别结果均为模拟，不会发出真实邮件。</p>
</div>
<script>
(() => {
  // THROWAWAY PROTOTYPE. A linear, in-memory story; no services or persistence.
  const spam='Вам перевод 195753 руб. забрать тут\n[领取链接已隐藏，不可打开]';
  const normal='我们有一个储能项目，想咨询设备选型。请团队联系我。';
  const scenes=[
    {chapter:'先看这次发生了什么',role:'网站上的联系表单',title:'机器人已经填好了这条留言',kind:'spam-form',explain:'它准备把你收到的那段俄文发进网站。',action:'模拟机器人点击「发送留言」',status:'尚未提交；你的邮箱还没有新邮件。'},
    {chapter:'先看这次发生了什么',role:'你的邮箱',title:'网站给你发了这封通知',kind:'spam-mail',explain:'这就是本次问题：网站把垃圾留言当成询盘，触发了团队通知。',action:'看看加上防护后，同一条留言会怎样',status:'垃圾内容成为正式询盘；团队收到通知。'},
    {chapter:'换成推荐方案，再试一次',role:'网站上的联系表单',title:'还是同一条垃圾留言',kind:'spam-form',explain:'推荐方案会先做安全检查，再决定是否进入正常询盘和发信流程。',action:'模拟发送同一条垃圾留言',status:'尚未提交；这次将使用推荐处理方式。'},
    {chapter:'换成推荐方案，再试一次',role:'网站后台 · 待复核',title:'这次，它被留在待复核区',kind:'spam-held',explain:'本例假设命中了已知垃圾样本。原文保留在后台，你的邮箱不再收到这封垃圾通知。',action:'接着看：正常客户会不会受影响',status:'团队邮件 0 封；后台保存 1 条待复核记录。'},
    {chapter:'再看正常客户',role:'网站上的联系表单',title:'这是一位真实客户的询盘',kind:'normal-form',explain:'客户仍然填写原来的信息。在这个场景里，安全检查在后台通过。',action:'替客户点击「发送询盘」',status:'客户不用注册账号，也没有新增必填资料。'},
    {chapter:'再看正常客户',role:'你的邮箱',title:'正常询盘照常通知你',kind:'normal-mail',explain:'这位客户没有额外点验证码。你照常收到询盘，后续仍由团队线下处理。',action:'继续看：如果客户需要勾选一次',status:'正常询盘已保存；团队收到 1 封通知。'},
    {chapter:'补充：有时需要多点一下',role:'客户看到的安全检查',title:'这次需要客户确认是真人',kind:'challenge',explain:'客户点一下下面的勾选框，系统就继续刚才的发送，不需要重新填写或再点发送。',action:'',status:'客户内容保留；完成这一步后继续发送。'},
    {chapter:'补充：有时需要多点一下',role:'你的邮箱',title:'勾选后，询盘也正常到了',kind:'normal-mail',explain:'这次客户只多做了一次勾选。实际有多少客户会遇到这一步，需要接入后测量。',action:'最后看：安全检查连不上时怎么办',status:'同一次提交只保存一次、通知一次。'},
    {chapter:'补充：安全检查连不上',role:'客户看到的页面',title:'客户已经写完，但验证服务暂时不可用',kind:'outage',explain:'客户的输入仍然保留。除重试外，推荐提供受限暂存入口，把需求交给团队人工核验。',action:'客户选择「先保存，交给团队核验」',status:'没有发信；客户填写的内容仍在。'},
    {chapter:'补充：安全检查连不上',role:'网站后台 · 验证未完成',title:'需求保存了，没有当作垃圾',kind:'needs-review',explain:'它与疑似垃圾分开标记。团队在后台看到待办和汇总提醒，再判断是否是真实客户。',action:'你确认是真客户，接收这条询盘',status:'1 条需求待人工核验；暂不自动发邮件。'},
    {chapter:'演示结束',role:'你的邮箱',title:'人工确认后，进入正常询盘流程',kind:'normal-mail',explain:'这就是推荐的处理方式：垃圾内容先隔离；正常询盘照常通知；验证故障时保留人工接回的路径。',action:'从头再看一遍',status:'人工确认只触发一次正常通知。'}
  ];
  const move=(index,action)=>action==='BACK'?Math.max(0,index-1):action==='NEXT'?(index+1)%scenes.length:index;
  const root=document.getElementById('linker-simple-story');if(!root)return;
  const el=q=>root.querySelector(q);
  let index=0;
  const safe=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const quote=s=>`<p class="story-quote">${safe(s)}</p>`;
  function content(s) {
    if(s.kind==='spam-form')return `<div class="story-message"><p><strong>公司</strong>　google</p><p><strong>留言</strong></p>${quote(spam)}<p class="story-dim">大意：声称有一笔转账，诱导收件人去外部链接领取。</p></div>`;
    if(s.kind==='spam-mail')return `<div class="story-message"><p class="story-dim">发件人：Linker</p><p><strong>New inquiry #8009 from google</strong></p><p>联系表单收到一条新留言：</p>${quote(spam)}</div>`;
    if(s.kind==='spam-held')return `<div class="story-message"><p><strong>疑似垃圾 · 待复核</strong></p><p>公司：google</p>${quote(spam)}<p class="story-dim">依据：本场景模拟识别出已知转账诱导样本。</p></div><div class="story-note">你的邮箱：没有新增这封通知。<br>原始留言：仍保存在后台，可复核。</div>`;
    if(s.kind==='normal-form')return `<div class="story-message"><p><strong>客户</strong>　Alex Meyer（示例）</p><p><strong>回复邮箱</strong>　alex@example.com</p><p><strong>留言</strong></p>${quote(normal)}</div>`;
    if(s.kind==='normal-mail')return `<div class="story-message"><p class="story-dim">发件人：Linker</p><p><strong>一条新的客户询盘（示意）</strong></p><p>客户：Alex Meyer</p>${quote(normal)}<p class="story-dim">现在可以由团队按原来的方式联系客户。</p></div>`;
    if(s.kind==='challenge')return `<div class="story-message"><p><strong>您的询盘已经填写好</strong></p>${quote(normal)}<div class="story-note">完成下面的一次勾选，就继续发送这条询盘。</div></div>`;
    if(s.kind==='outage')return `<div class="story-message"><p><strong>客户已填写的留言</strong></p>${quote(normal)}<div class="story-note">安全检查暂时无法完成。<br>您的输入仍然保留。</div></div>`;
    return `<div class="story-message"><p><strong>验证未完成 · 优先待核</strong></p><p>客户：Alex Meyer</p>${quote(normal)}<p class="story-dim">原因：验证服务不可用。没有判定客户是垃圾发送者。</p></div><div class="story-note">保存只进入有额度限制的待核区。<br>不会立即发信、创建账号或调用 AI。</div>`;
  }
  function render(){
    const s=scenes[index];
    el('.story-chapter').textContent=s.chapter;
    el('.story-count').textContent=`${index+1} / ${scenes.length}`;
    el('.story-role').textContent=s.role;
    el('.story-body').innerHTML=`<h3>${s.title}</h3>${content(s)}`;
    el('.story-outcome').innerHTML=`<p>${s.explain}</p>`;
    el('.story-action').textContent=s.action;
    el('button.story-action').hidden=s.kind==='challenge';
    el('.story-check').hidden=s.kind!=='challenge';
    el('.story-check input').checked=false;
    el('.story-back').disabled=index===0;
    el('.story-status').textContent=s.status;
  }
  el('button.story-action').addEventListener('click',()=>{index=move(index,'NEXT');render();});
  el('.story-check input').addEventListener('change',()=>{index=move(index,'NEXT');render();});
  el('.story-back').addEventListener('click',()=>{index=move(index,'BACK');render();});
  render();
})();
</script>

</main></body></html>
