[project]
name = "linker-pull"
version = "0.1.0"
description = "Read-only snapshots of the live de-linker.com, and loading them into a local WordPress instance."
# The services' Python (docs/research/2026-10-09/framework-choice.md §7), so one
# interpreter serves every uv project in the repository.
requires-python = ">=3.12"
# linker-local (tools/local, ticket #5): the instance this tool loads into —
# its Registry and Instance, and snapshot.install, the one implementation of
# installing a snapshot's files.
dependencies = ["linker-local"]

[tool.uv.sources]
linker-local = { path = "../local" }

[project.scripts]
linker-pull = "linker_pull.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
# Range written by `uv init --package` with uv 0.10.11.
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting, bugbear and pyupgrade, as in the services.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# jsonschema ships no type information; only the manifest test imports it.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A deprecation is fixed when it appears, not when the API is removed.
filterwarnings = ["error"]
