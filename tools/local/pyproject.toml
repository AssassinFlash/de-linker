[project]
name = "linker-local"
version = "0.1.0"
description = "Local WordPress instances of de-linker.com on this Mac (docs/local-stack.md)."
# The services' Python (docs/research/2026-10-09/framework-choice.md §7), so one
# interpreter serves every uv project in the repository.
requires-python = ">=3.12"
dependencies = []

[project.scripts]
linker-local = "linker_local.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
# Range written by `uv init --package` with uv 0.10.11.
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting, bugbear and pyupgrade, as in the services.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A deprecation is fixed when it appears, not when the API is removed.
filterwarnings = ["error"]
