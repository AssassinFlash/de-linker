name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The VPS's release (docs/research/2026-10-09/old-repo-006-target-architecture.md);
    # named, so the runner does not move when ubuntu-latest does.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Production versions: PHP 8.3 on the host and Python 3.12 on the VPS
        # (docs/research/2026-10-09/framework-choice.md §2, §7); Node 22 builds
        # the apps on the Mac, within the engines of @wordpress/scripts 36.
        php: ["8.3"]
        node: ["22"]
        python: ["3.12"]
    # Each action is pinned to the commit of its latest release on 2026-10-09
    # (`gh api repos/<owner>/<repo>/releases/latest`); the tag follows the SHA.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # The composer.lock files are Composer 2 locks (written with 2.9.7).
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The uv that wrote the uv.lock files.
          version: "0.10.11"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            services/*/uv.lock
            tools/*/uv.lock

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # The just the justfile is written for.
          tool: just@1.58.0

      # The German-coverage gate reads the .po catalogs with gettext's own
      # tools (msgattrib, msgfmt); the runner image does not carry them.
      - name: gettext for the i18n coverage gate
        run: sudo apt-get update && sudo apt-get install -y gettext

      # #302: reproduce linker-tools script catalogs using the local stack's
      # WP-CLI version. i18n make-json does not need a WordPress instance.
      - name: WP-CLI 2.12 for script translation reproducibility
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version

      - name: just check
        run: just check

      - name: Playwright's Chromium and its system libraries
        working-directory: plugins/linker-tools
        run: npx playwright install --with-deps --only-shell chromium

      - name: just test
        run: just test

      # build/manifest.json says what the committed build/ was made from; a
      # fresh build proves the files themselves are what the sources produce.
      - name: just build reproduces the committed build/
        run: |
          just build
          git status --porcelain -- plugins/linker-tools/build plugins/linker-commerce/build
          test -z "$(git status --porcelain -- plugins/linker-tools/build plugins/linker-commerce/build)"

  mu-smoke:
    # The must-use plugins' smoke suite asserts properties of a real site (the
    # response headers, the closed REST user list, the recorder's file, the
    # pin's installation), so it needs WordPress: this job builds the smallest
    # one — a bare instance, no snapshot, since none of those properties is
    # content — and runs `just mu-smoke`. MySQL and Redis are the runner
    # image's own; WP-CLI is pinned to the version the local stack requires.
    runs-on: ubuntu-24.04
    env:
      # The runner image's MySQL root credentials; see the MySQL step below.
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0

      # tools/local's wpcli.require_version() wants WP-CLI 2.12 (production's).
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version

      # The stack administers MySQL as root (`mysql --user=root …`;
      # tools/local/src/linker_local/mysql.py) and the image's root is not
      # passwordless (root/root, the runner image's own credentials), so the
      # password rides in MYSQL_PWD: the stack's mysql calls inherit the job's
      # environment, which is what the local stack on a Mac gets from
      # Homebrew's passwordless root. Redis is already installed.
      - name: MySQL and Redis for the instance
        run: |
          sudo systemctl start mysql
          # The image documents Redis but carries no redis-server binary
          # (measured: command not found), and the stack only needs something
          # listening on 6379 (objectcache.require_redis()).
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
          redis-server --daemonize yes
          mysql --user=root --skip-column-names --execute 'SELECT VERSION();'
          redis-cli ping

      - name: a bare instance (no snapshot)
        run: just up smoke

      - name: the must-use plugins' smoke suite
        run: just mu-smoke smoke

      # #373: two PHP processes commit one conversation and the trace shows
      # one of them blocked in GET_LOCK. The instance's linker-tools is this
      # checkout (`just up` symlinks it).
      - name: Genie conversation concurrency
        run: just genie-concurrency smoke

      # #297: native WordPress/Woo routing and an authenticated loopback SMTP
      # sink. The test owns the server and uses fake values only; mail() is
      # captured to files. The existing bare instance is sufficient for mail.
      - name: internal SMTP, notification routing and mail-language integration
        working-directory: plugins/linker-commerce
        run: |
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter 'ReviewReminderTest|MailBudgetRollbackTest|MailBudgetTest|InternalSmtpTest|NotificationRoutingTest|MailRetryTest|DigestTest|HealthMonitorTest|LanguageLinksInMailTest'

      # #414: the abilities route, including the customer token. The test

      # #519: real REST proof consumption, multi-dimensional admission,
      # account privacy, advisory mode and actual disconnect/peer recovery.
      # Uses synthetic inputs and intercepted HTTP; no external mail/provider.
      - name: public verification and atomic admission
        working-directory: plugins/linker-commerce
        run: |
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter 'PublicControllerTest|PublicLedgerTest|PublicVerificationTest|PublicProofTest|PublicAdmissionOwnersTest|BusinessPolicyTest|BusinessAdmissionTest'

      # #414: the abilities route, including the customer token. The test
      # builds its own account and inquiry on this bare instance. It is not
      # a #339 conversation case: Genie copies inquiry id and status only
      # (facts._from_inquiry), so a dialogue fixture would not show a leaked
      # total. The Proforma download is the next step.
      - name: inquiry status price gate
        working-directory: plugins/linker-commerce
        run: |
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter InquiryStatusRestTest
      # #496: the design report's "Ask Genie" reference. The route refuses a
      # guest (401) and another customer's solution (403), and the owner's
      # solution carries the engine's figures and no price. The engine is a
      # pre_http_request double, so the bare instance needs no tuning.
      - name: saved solution reader
        working-directory: plugins/linker-commerce
        run: |
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter ReadSolutionRestTest
      # #405: an edit drops the cached page through wp_remote_post. After the
      # mail tests, so Polylang setup does not change their instance.
      - name: page cache follows a save
        run: just page-cache-chain smoke

      # #521: native pre-dispatch resource/replay/privacy fixtures. The preceding
      # page-cache step installs the local-only service token. All HTTP is
      # intercepted; running-version responses and sizing inputs are synthetic.
      - name: public resource admission and private service handoff
        run: |
          just wp smoke option update linker_engine_url http://127.0.0.1:9
          just wp smoke option update linker_genie_url http://127.0.0.1:9
          cd plugins/linker-tools
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter ResourceAdmissionTest

      # #425: an issued Proforma priced at 1680. Pending and restricted
      # accounts get no link and a 404 with no PDF bytes, in EN and DE,
      # including a direct request that does not use the link. Not a #339
      # conversation case, for the same reason as #414. pdftotext reads the
      # PDF: dompdf draws glyph ids, so the amount is not in the raw bytes.
      - name: proforma price gate
        working-directory: plugins/linker-commerce
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter ProformaPriceGateTest

      # #453: the Genie inquiry card's whole chain — conversation, REST route,
      # the inquiry writer, the Proforma gateway, the Outbox queue — as one
      # class of tests. It builds its own product, customer and conversation;
      # its German inquiry needs the de language the page-cache step above
      # configured, which runs before this one in this job.
      - name: genie inquiry chain
        working-directory: plugins/linker-commerce
        run: |
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter GenieInquiryTest

      # The observation-only classifier uses fake service answers and local
      # Outbox data. Includes private review history, native privacy, two real
      # PHP connections, and rollback after a failed metadata write.
      - name: inquiry assessment, customer evidence and staff review
        working-directory: plugins/linker-commerce
        run: |
          LINKER_WP_ROOT="$HOME/de-linker-local/smoke/wordpress" \
            php vendor/bin/phpunit -c phpunit.integration.xml.dist \
            --filter 'InquiryAssessmentTest|CustomerEvidenceTest|CustomerReviewTest|NotificationHoldTest|AssessmentAsyncTest|SafeIntakeTest'

      # The cleanup runs even when an earlier step failed and the instance was
      # never built, so it reports rather than failing the job twice.
      - name: stop the instance
        if: always()
        run: just down smoke || echo "no instance to stop"
