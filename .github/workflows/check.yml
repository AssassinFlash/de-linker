name: check
run-name: "check #${{ github.event.pull_request.number || github.ref_name }} | tree-ref=${{ github.sha }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      ledger: ${{ steps.scope.outputs.ledger }}
      presentation: ${{ steps.scope.outputs.presentation }}
      php: ${{ steps.scope.outputs.php }}
      js: ${{ steps.scope.outputs.js }}
      python: ${{ steps.scope.outputs.python }}
      content: ${{ steps.scope.outputs.content }}
      build: ${{ steps.scope.outputs.build }}
      commerce: ${{ steps.scope.outputs.commerce }}
      native: ${{ steps.scope.outputs.native }}
      planner: ${{ steps.scope.outputs.planner }}
      engine: ${{ steps.scope.outputs.engine }}
      genie: ${{ steps.scope.outputs.genie }}
      catalog_changed: ${{ steps.scope.outputs.catalog_changed }}
      php_test_changed: ${{ steps.scope.outputs.php_test_changed }}
      planner_build_changed: ${{ steps.scope.outputs.planner_build_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}
          sparse-checkout: |
            **/.gitattributes
            tools/checks/ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Select checks from the actual change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/checks/ci_scope.py plan

  php:
    name: php-lane
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.php == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        lane: [static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lane == 'unit'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: PHP static
        if: matrix.lane == 'static'
        run: just php-check
      - name: PHP unit
        if: matrix.lane == 'unit'
        run: |
          just js-install
          just php-test

  js:
    name: js-lane
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        lane: [static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
            tests/e2e/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: JavaScript static
        if: matrix.lane == 'static'
        run: |
          just js-check
          just e2e-check
      - name: JavaScript unit and browser suites
        if: matrix.lane == 'unit'
        run: |
          cd plugins/linker-tools
          npx playwright install --with-deps --only-shell chromium
          cd ../..
          just js-test

  python:
    name: python-lane
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        lane: [static, genie, engine, tools, harnesses, pull, cutover]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/*/uv.lock
            tools/*/uv.lock
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: matrix.lane == 'tools' || matrix.lane == 'pull' || matrix.lane == 'cutover'
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lane == 'engine'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Python unit native helpers
        if: matrix.lane == 'tools'
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version
      - name: Python static
        if: matrix.lane == 'static'
        run: just py-check
      - name: Genie tests
        if: matrix.lane == 'genie'
        run: just py-test-group genie
      - name: Engine tests
        if: matrix.lane == 'engine'
        run: |
          cd apps/planner
          npm ci --no-audit --no-fund
          cd ../..
          just py-test-group engine
      - name: Python tool tests
        if: matrix.lane == 'tools'
        run: just py-test-group tools
      - name: Campaign harness tests
        if: matrix.lane == 'harnesses'
        run: just py-test-group harnesses
      - name: Pull snapshot tests
        if: matrix.lane == 'pull'
        run: just pull::test
      - name: Cutover tests
        if: matrix.lane == 'cutover'
        run: just cutover::test

  content:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.content == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            tools/pull/uv.lock
            tools/cutover/uv.lock
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version
      - name: Content, catalogue, pull and cutover contracts
        run: just ci-content

  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Build contract and committed artifact reproduction
        run: just ci-build

  presentation:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.presentation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext for changed catalogues
        if: needs.plan.outputs.catalog_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: WP-CLI for changed catalogues
        if: needs.plan.outputs.catalog_changed == 'true'
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Existing presentation contracts and affected source guards
        env:
          PHP_TEST_CHANGED: ${{ needs.plan.outputs.php_test_changed }}
          CATALOG_CHANGED: ${{ needs.plan.outputs.catalog_changed }}
        run: just ci-presentation

  commerce:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.commerce == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-commerce/package-lock.json
            plugins/linker-tools/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext and WP-CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Commerce source, unit and content checks
        run: just commerce-check

  native:
    name: mu-smoke
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        group: [core, mail, inquiry, inventory, runtime, admin]
    env:
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext poppler-utils
          if ! command -v redis-server >/dev/null; then
            sudo apt-get install -y redis-server
          fi
          sudo systemctl start mysql
          redis-server --daemonize yes
          mysql --user=root --skip-column-names --execute 'SELECT VERSION();'
          redis-cli ping
      - name: a bare instance
        run: just up smoke
      - name: native integration group
        run: just ci-native "${{ matrix.group }}" smoke
      - name: stop the instance
        if: always()
        run: just down smoke || echo "no instance to stop"

  planner:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.planner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/planner/package-lock.json
      - name: Planner source, tests and isolated build reproduction
        working-directory: apps/planner
        run: |
          npm ci --no-audit --no-fund
          npm run lint:js
          npm run lint:types
          npm run lint:format
          npm test
          npm run build
          node ../../plugins/linker-tools/bin/build-manifest.mjs write
          git diff --exit-code -- ../../plugins/linker-tools/build/planner ../../plugins/linker-tools/build/manifest.json
          npm run build:check
          node ../../plugins/linker-tools/bin/build-manifest.mjs check
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: needs.plan.outputs.planner_build_changed == 'true'
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Committed Planner manifest's WordPress consumer
        if: needs.plan.outputs.planner_build_changed == 'true'
        working-directory: plugins/linker-tools
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --quiet
          php vendor/bin/phpunit tests/php/Unit/PlannerApplicationTest.php

  engine:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.engine == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/planner/package-lock.json
      - name: Planner runtime for cross-boundary Engine contracts
        working-directory: apps/planner
        run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/engine/uv.lock
            services/engine/pyproject.toml
      - name: Engine lint, types and unit contracts
        working-directory: services/engine
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy .
          uv run --locked pytest

  genie:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.genie == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/genie/uv.lock
            services/genie/pyproject.toml
            services/genie/eval/judges/pyproject.toml
      - name: Genie lint, types and unit contracts
        working-directory: services/genie
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy .
          uv run --locked pytest

  check:
    name: check
    needs: [plan, presentation, php, js, python, content, build, commerce, native, planner, engine, genie]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}
          sparse-checkout: |
            **/.gitattributes
            tools/checks/ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Record validated scope (${{ needs.plan.outputs.mode }})
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LEDGER: ${{ needs.plan.outputs.ledger }}
          JOB_RESULTS: ${{ toJson(needs) }}
        run: python3 tools/checks/ci_scope.py gate
