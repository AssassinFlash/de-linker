name: check
run-name: "check #${{ github.event.pull_request.number || github.ref_name }} | tree-ref=${{ github.sha }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      ledger: ${{ steps.scope.outputs.ledger }}
      presentation: ${{ steps.scope.outputs.presentation }}
      php: ${{ steps.scope.outputs.php }}
      js: ${{ steps.scope.outputs.js }}
      python: ${{ steps.scope.outputs.python }}
      content: ${{ steps.scope.outputs.content }}
      build: ${{ steps.scope.outputs.build }}
      commerce: ${{ steps.scope.outputs.commerce }}
      native: ${{ steps.scope.outputs.native }}
      planner: ${{ steps.scope.outputs.planner }}
      engine: ${{ steps.scope.outputs.engine }}
      genie: ${{ steps.scope.outputs.genie }}
      catalog_changed: ${{ steps.scope.outputs.catalog_changed }}
      php_test_changed: ${{ steps.scope.outputs.php_test_changed }}
      planner_build_changed: ${{ steps.scope.outputs.planner_build_changed }}
      php_matrix: ${{ steps.scope.outputs.php_matrix }}
      js_matrix: ${{ steps.scope.outputs.js_matrix }}
      python_matrix: ${{ steps.scope.outputs.python_matrix }}
      build_matrix: ${{ steps.scope.outputs.build_matrix }}
      native_matrix: ${{ steps.scope.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}
          sparse-checkout: |
            **/.gitattributes
            tools/checks/ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Select checks from the actual change
        id: scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/checks/ci_scope.py plan

  php:
    name: "php-lane (${{ matrix.project }})"
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.php == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.php_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.project == 'plugins/linker-tools'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Validate module
        run: just ci-php-package "${{ matrix.project }}"

  js:
    name: "js-lane (${{ matrix.project }})"
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.js_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
            tests/e2e/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Browser dependencies for the browser-backed package
        if: matrix.project == 'tools'
        run: |
          just ci-node-deps plugins/linker-tools
          cd plugins/linker-tools
          npx playwright install-deps chromium
      - name: Validate module
        run: just ci-js-package "${{ matrix.project }}"

  python:
    name: "python-lane (${{ matrix.project }})"
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/*/uv.lock
            tools/*/uv.lock
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: matrix.project != 'harnesses'
        with:
          php-version: "8.3"
          coverage: none
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Python unit native helpers
        if: matrix.project == 'tools/local' || matrix.project == 'tools/migrate'
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version
      - name: Validate module
        run: |
          if [ "${{ matrix.project }}" = harnesses ]; then
            just ci-python-harnesses
          else
            just ci-python-package "${{ matrix.project }}"
          fi

  content:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.content == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version
      - name: Validate module
        run: just ci-content

  build:
    name: "build (${{ matrix.project }})"
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Validate module
        run: just ci-build-package "${{ matrix.project }}"

  presentation:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.presentation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext for changed catalogues
        if: needs.plan.outputs.catalog_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: WP-CLI for changed catalogues
        if: needs.plan.outputs.catalog_changed == 'true'
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Validate module
        env:
          PHP_TEST_CHANGED: ${{ needs.plan.outputs.php_test_changed }}
          CATALOG_CHANGED: ${{ needs.plan.outputs.catalog_changed }}
        run: just ci-presentation

  commerce:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.commerce == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-commerce/package-lock.json
            plugins/linker-tools/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext and WP-CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Commerce source, unit and content checks
        run: just commerce-check

  native:
    name: "mu-smoke (${{ matrix.group }})"
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.native_matrix) }}
    env:
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext poppler-utils
          if ! command -v redis-server >/dev/null; then
            sudo apt-get install -y redis-server
          fi
          sudo systemctl start mysql
          redis-server --daemonize yes
          mysql --user=root --skip-column-names --execute 'SELECT VERSION();'
          redis-cli ping
      - name: a bare instance
        run: just up smoke
      - name: Validate module
        run: just ci-native "${{ matrix.group }}" smoke
      - name: stop the instance
        if: always()
        run: just down smoke

  planner:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.planner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLANNER_BUILD_CHANGED: ${{ needs.plan.outputs.planner_build_changed }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify Planner invocation
        run: python3 tools/checks/ci_scope.py verify-planner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: env.PLANNER_BUILD_CHANGED == 'true'
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Planner dependencies
        run: just ci-planner-deps
      - name: Check
        run: just ci-planner-check
      - name: Test
        run: just ci-planner-test
      - name: Build
        run: just ci-planner-build
      - name: Planner PHP
        if: env.PLANNER_BUILD_CHANGED == 'true'
        run: just ci-planner-php

  engine:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.engine == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/engine/uv.lock
            services/engine/pyproject.toml
      - name: Planner dependencies
        run: just ci-planner-deps
      - name: Check
        run: just ci-service-check engine
      - name: Test
        run: just ci-service-test engine

  genie:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.genie == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/genie/uv.lock
            services/genie/pyproject.toml
            services/genie/eval/judges/pyproject.toml
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Check
        run: just ci-service-check genie
      - name: Test
        run: just ci-service-test genie

  check:
    name: check
    needs:
      [
        plan,
        presentation,
        php,
        js,
        python,
        content,
        build,
        commerce,
        native,
        planner,
        engine,
        genie,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}
          sparse-checkout: |
            **/.gitattributes
            tools/checks/ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Record validated scope (${{ needs.plan.outputs.mode }})
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LEDGER: ${{ needs.plan.outputs.ledger }}
          JOB_RESULTS: ${{ toJson(needs) }}
        run: python3 tools/checks/ci_scope.py gate
