name: check
run-name: "check #${{ github.event.pull_request.number || github.ref_name }} | tree-ref=${{ github.sha }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      catalog_changed: ${{ steps.scope.outputs.catalog_changed }}
      php_test_changed: ${{ steps.scope.outputs.php_test_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}
          sparse-checkout: |
            **/.gitattributes
          sparse-checkout-cone-mode: false
      - name: Select checks from the actual change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], stderr=subprocess.DEVNULL)

          def document(path):
              return path in {"AGENTS.md", "CLAUDE.md", "CONTEXT.md", "README.md"} or (
                  path.startswith("docs/") and path.endswith((".md", ".rst", ".txt"))
              )

          def acceptance_record(path):
              return path.startswith("docs/acceptance/") and path.endswith((".json", ".png", ".pdf", ".jpg", ".jpeg"))

          def non_runtime_file(commit, path):
              if git("ls-tree", commit, "--", path).split()[0] != b"100644":
                  return False
              content = git("show", f"{commit}:{path}")
              if acceptance_record(path):
                  if path.endswith(".png"):
                      return content.startswith(b"\x89PNG\r\n\x1a\n")
                  if path.endswith((".jpg", ".jpeg")):
                      return content.startswith(b"\xff\xd8\xff")
                  if path.endswith(".pdf"):
                      return content.startswith(b"%PDF-")
                  json.loads(content)
                  return True
              if b"\0" in content:
                  return False
              content.decode("utf-8")
              return True

          def non_runtime_change(status, path, base, head):
              revisions = {"M": (base, head), "A": (head,), "D": (base,)}.get(status, ())
              return bool(revisions) and all(non_runtime_file(rev, path) for rev in revisions)

          def commerce(path):
              return bool(re.fullmatch(
                  r"plugins/linker-commerce/(includes/(Presentation/(ProductShortcodes|LanguageLinks|LibraryPage)[.]php|Storefront/ProductView[.]php|Registration/PendingProfileCapacity[.]php)|assets/[a-z0-9-]+[.]js|content/(livecanvas/(de/)?[a-z0-9_-]+[.]html|windpress/[a-z0-9_-]+[.]css)|languages/linker-commerce-de_DE_formal[.](po|mo)|tests/php/(Unit/(Presentation/(ProductShortcodes|LanguageLinks|LibraryPage)Test[.]php|Storefront/ProductViewTest[.]php)|Integration/RegistrationCapacityTest[.]php)|tests/js/[a-z0-9-]+[.]test[.]mjs)", path
              ))

          def regular_change(status, path, base, head):
              revisions = {"M": (base, head), "A": (head,), "D": (base,)}.get(status, ())
              return bool(revisions) and all(git("ls-tree", rev, "--", path).split()[0] == b"100644" for rev in revisions)

          def classify(changes):
              def presentation(path):
                  return bool(re.fullmatch(
                      r"plugins/linker-commerce/content/(livecanvas/(de/)?[a-z0-9_-]+[.]html|windpress/[a-z0-9_-]+[.]css)", path
                  )) or path == "plugins/linker-commerce/tests/php/Unit/Presentation/TemplatesTest.php"
              if changes and all(document(path) or acceptance_record(path) for _, path in changes):
                  return "docs"
              if changes and all(document(path) or acceptance_record(path) or (status == "M" and presentation(path)) for status, path in changes):
                  return "presentation"
              if changes and all(document(path) or acceptance_record(path) or (status == "M" and commerce(path)) for status, path in changes):
                  return "commerce"
              return "full"

          def api(endpoint):
              result = subprocess.run(["gh", "api", endpoint], capture_output=True, text=True, timeout=30, check=True)
              return json.loads(result.stdout)

          def latest_run(sha, event=""):
              repo = os.environ["REPOSITORY"]
              endpoint = f"repos/{repo}/actions/workflows/check.yml/runs?head_sha={sha}&per_page=100"
              if event:
                  endpoint += "&event=" + event
              runs = api(endpoint)["workflow_runs"]
              runs = [r for r in runs if r["head_sha"] == sha and r["path"] == ".github/workflows/check.yml"
                      and r["event"] in {"pull_request", "push", "workflow_dispatch"}
                      and (not event or r["event"] == event)]
              return max(runs, key=lambda r: (r["run_number"], r["run_attempt"]), default=None)

          def successful(run):
              return run and run["status"] == "completed" and run["conclusion"] == "success"

          def checked_run(run, commit, *, docs_only=False):
              if not successful(run):
                  return False
              workflow = ".github/workflows/check.yml"
              if git("rev-parse", f"{commit}:{workflow}") != git("rev-parse", f"HEAD:{workflow}"):
                  return False
              marker = re.fullmatch(r"check #[^\n]+ [|] tree-ref=([0-9a-f]{40})", run.get("display_title", ""))
              if not marker:
                  return False
              tested = marker.group(1)
              try:
                  tree = git("rev-parse", tested + "^{tree}").decode().strip()
              except subprocess.CalledProcessError:
                  repo = os.environ["REPOSITORY"]
                  tree = api(f"repos/{repo}/git/commits/{tested}")["tree"]["sha"]
              if tree != git("rev-parse", commit + "^{tree}").decode().strip():
                  return False
              repo = os.environ["REPOSITORY"]
              jobs = api(f"repos/{repo}/actions/runs/{run['id']}/attempts/{run['run_attempt']}/jobs?per_page=100")["jobs"]
              allowed = {"full", "presentation", "commerce"} if run["event"] == "pull_request" else {"full", "reuse"}
              if docs_only:
                  allowed = {"docs"}
              labels = {f"Record validation scope ({mode})" for mode in allowed}
              return any(step["name"] in labels and step.get("conclusion") == "success"
                         for job in jobs if job["name"].startswith("check (")
                         for step in job.get("steps", []))

          def checked_pr_tree(commit):
              parents = git("rev-list", "--parents", "-n", "1", commit).decode().split()
              if len(parents) >= 3:
                  source = parents[2]
              else:
                  subject = git("show", "-s", "--format=%s", commit).decode().strip()
                  pull = re.search(r"\(#([0-9]+)\)$", subject)
                  if not pull:
                      return None
                  repo = os.environ["REPOSITORY"]
                  source = api(f"repos/{repo}/pulls/{pull.group(1)}")["head"]["sha"]
              run = latest_run(source, "pull_request")
              return run if checked_run(run, commit) else None

          def checked_base(commit):
              while True:
                  run = latest_run(commit)
                  if checked_run(run, commit):
                      return True
                  if checked_run(run, commit, docs_only=True):
                      try:
                          parent = git("rev-parse", commit + "^1").decode().strip()
                      except subprocess.CalledProcessError:
                          git("fetch", "--deepen=1", "origin", commit)
                          parent = git("rev-parse", commit + "^1").decode().strip()
                      fields = git("diff", "--name-status", "-z", "--find-renames", parent, commit).decode(errors="surrogateescape").split("\0")
                      changes = list(zip(fields[0:-1:2], fields[1:-1:2]))
                      if classify(changes) != "docs" or not all(non_runtime_change(status, path, parent, commit) for status, path in changes):
                          return False
                      commit = parent
                      continue
                  if run and (run["status"] != "completed" or run["conclusion"] != "cancelled"):
                      return False
                  return bool(checked_pr_tree(commit))

          event = os.environ["EVENT_NAME"]
          head = os.environ["HEAD_SHA"]
          base = os.environ.get("BASE_SHA", "")
          changes = []
          mode, reason = "full", "Runtime, control-plane or unproven changes retain the complete checks."
          if base and set(base) != {"0"}:
              try:
                  try:
                      git("cat-file", "-e", base + "^{commit}")
                  except subprocess.CalledProcessError:
                      git("fetch", "--depth=1", "origin", base)
                  formatting = subprocess.run(["git", "diff", "--check", base, head])
                  if formatting.returncode:
                      raise SystemExit(formatting.returncode)
                  fields = git("diff", "--name-status", "-z", "--no-renames", base, head).decode(errors="surrogateescape").split("\0")
                  changes = list(zip(fields[0:-1:2], fields[1:-1:2]))
                  if event in {"pull_request", "push"}:
                      candidate = classify(changes)
                      valid = all(
                          regular_change(status, path, base, head) if candidate == "commerce" and commerce(path)
                          else non_runtime_change(status, path, base, head)
                          for status, path in changes
                      ) if candidate != "full" else False
                      if candidate != "full" and not valid:
                          candidate = "full"
                      if candidate == "docs":
                          mode, reason = "docs", "Documentation and acceptance records only; no runtime or instance checks."
                      elif candidate in {"presentation", "commerce"} and event == "pull_request":
                          if checked_base(base):
                              mode = candidate
                              reason = ("Existing LC/CSS surfaces and a checked base; run their contracts and content guards." if mode == "presentation"
                                        else "Established commerce surfaces and a checked base; run commerce source, unit and native checks.")
              except (OSError, subprocess.SubprocessError, UnicodeError, KeyError, ValueError, IndexError):
                  mode, reason = "full", "Change or baseline proof unavailable; complete checks required."
          if event == "push" and mode != "docs":
              try:
                  run = checked_pr_tree(head)
                  if run:
                      mode = "reuse"
                      reason = f"Identical complete Git tree; successful PR check run {run['id']} reused."
              except (OSError, subprocess.SubprocessError, KeyError, ValueError):
                  mode, reason = "full", "No proven successful check for this tree; complete checks required."
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"catalog_changed={str(any(path.startswith('plugins/linker-commerce/content/livecanvas/') for _, path in changes)).lower()}\n")
              f.write(f"php_test_changed={str(any(path == 'plugins/linker-commerce/tests/php/Unit/Presentation/TemplatesTest.php' for _, path in changes)).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write(f"### Validation scope: {mode}\n\n{reason}\n")
          print(f"Validation scope: {mode}. {reason}")
          PYTHON

  php-lane:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        lane: [static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lane == 'unit'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: PHP static
        if: matrix.lane == 'static'
        run: just php-check
      - name: PHP unit
        if: matrix.lane == 'unit'
        run: |
          just js-install
          just php-test

  js-lane:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        lane: [static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
            tests/e2e/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: JavaScript static
        if: matrix.lane == 'static'
        run: |
          just js-check
          just e2e-check
      - name: JavaScript unit and browser suites
        if: matrix.lane == 'unit'
        run: |
          cd plugins/linker-tools
          npx playwright install --with-deps --only-shell chromium
          cd ../..
          just js-test

  python-lane:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        lane: [static, genie, engine, tools, harnesses, pull, cutover]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/*/uv.lock
            tools/*/uv.lock
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: matrix.lane == 'tools' || matrix.lane == 'pull' || matrix.lane == 'cutover'
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lane == 'engine'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Python unit native helpers
        if: matrix.lane == 'tools'
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version
      - name: Python static
        if: matrix.lane == 'static'
        run: just py-check
      - name: Genie tests
        if: matrix.lane == 'genie'
        run: just py-test-group genie
      - name: Engine tests
        if: matrix.lane == 'engine'
        run: |
          cd apps/planner
          npm ci --no-audit --no-fund
          cd ../..
          just py-test-group engine
      - name: Python tool tests
        if: matrix.lane == 'tools'
        run: just py-test-group tools
      - name: Campaign harness tests
        if: matrix.lane == 'harnesses'
        run: just py-test-group harnesses
      - name: Pull snapshot tests
        if: matrix.lane == 'pull'
        run: just pull::test
      - name: Cutover tests
        if: matrix.lane == 'cutover'
        run: just cutover::test

  content:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            tools/pull/uv.lock
            tools/cutover/uv.lock
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
          wp --version
      - name: Content, catalogue, pull and cutover contracts
        run: just ci-content

  build:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-tools/package-lock.json
            plugins/linker-commerce/package-lock.json
            apps/planner/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: Build contract and committed artifact reproduction
        run: just ci-build

  presentation:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'presentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext for changed catalogues
        if: needs.plan.outputs.catalog_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: WP-CLI for changed catalogues
        if: needs.plan.outputs.catalog_changed == 'true'
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Existing presentation contracts and affected source guards
        env:
          PHP_TEST_CHANGED: ${{ needs.plan.outputs.php_test_changed }}
          CATALOG_CHANGED: ${{ needs.plan.outputs.catalog_changed }}
        run: just ci-presentation

  commerce:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'commerce'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/linker-commerce/package-lock.json
            plugins/linker-tools/package-lock.json
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: gettext and WP-CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Commerce source, unit and content checks
        run: just commerce-check

  native-lane:
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'commerce')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        group: [core, mail, inquiry, inventory, runtime, admin]
    env:
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.11"
          python-version: "3.12"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0
      - name: WP-CLI 2.12
        run: |
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo chmod +x /usr/local/bin/wp
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext poppler-utils
          if ! command -v redis-server >/dev/null; then
            sudo apt-get install -y redis-server
          fi
          sudo systemctl start mysql
          redis-server --daemonize yes
          mysql --user=root --skip-column-names --execute 'SELECT VERSION();'
          redis-cli ping
      - name: a bare instance
        run: just up smoke
      - name: native integration group
        run: just ci-native "${{ matrix.group }}" smoke
      - name: stop the instance
        if: always()
        run: just down smoke || echo "no instance to stop"

  check:
    needs: [plan, php-lane, js-lane, python-lane, content, build, presentation, commerce]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        php: ["8.3"]
        node: ["22"]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'presentation' || needs.plan.outputs.mode == 'commerce'
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/docs/acceptance/**/*.png
            !/docs/acceptance/**/*.jpg
            !/docs/acceptance/**/*.jpeg
          sparse-checkout-cone-mode: false
      - name: Verify excluded acceptance image checkout
        if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'presentation' || needs.plan.outputs.mode == 'commerce'
        run: |
          git ls-files -v -z -- docs/acceptance | python3 -c '
          import os, sys
          entries = sys.stdin.buffer.read().split(b"\0")
          images = [entry for entry in entries if entry[2:].endswith((b".png", b".jpg", b".jpeg"))]
          present = [entry for entry in images if os.path.lexists(os.fsdecode(entry[2:]))]
          included = [entry for entry in images if entry[:1] != b"S"]
          print(f"Acceptance images: {len(images)} tracked, {len(present)} materialized, {len(included)} included in index")
          if present or included:
              sys.exit("Acceptance image checkout exclusions did not apply")
          '
      - name: Require a successful recognized plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          test "$PLAN_RESULT" = success
          case "$MODE" in full|presentation|commerce|docs|reuse) ;; *) exit 1 ;; esac
      - name: Record validation scope (${{ needs.plan.outputs.mode }})
        run: printf 'Validation scope %s; only applicable parallel lanes are required.\n' "${{ needs.plan.outputs.mode }}"
      - name: Require every applicable lane
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PHP_RESULT: ${{ needs.php-lane.result }}
          JS_RESULT: ${{ needs.js-lane.result }}
          PYTHON_RESULT: ${{ needs.python-lane.result }}
          CONTENT_RESULT: ${{ needs.content.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PRESENTATION_RESULT: ${{ needs.presentation.result }}
          COMMERCE_RESULT: ${{ needs.commerce.result }}
        run: |
          require() {
            local name="$1" result="$2"
            test "$result" = success || {
              echo "$name lane: $result (expected success)" >&2
              exit 1
            }
          }
          allow_skipped() {
            local result="$1"
            case "$result" in success|skipped) ;; *) return 1 ;; esac
          }
          case "$MODE" in
            full)
              require php "$PHP_RESULT"
              require javascript "$JS_RESULT"
              require python "$PYTHON_RESULT"
              require content "$CONTENT_RESULT"
              require build "$BUILD_RESULT"
              allow_skipped "$PRESENTATION_RESULT"
              allow_skipped "$COMMERCE_RESULT"
              ;;
            presentation)
              require presentation "$PRESENTATION_RESULT"
              for result in "$PHP_RESULT" "$JS_RESULT" "$PYTHON_RESULT" "$CONTENT_RESULT" "$BUILD_RESULT" "$COMMERCE_RESULT"; do
                allow_skipped "$result" || exit 1
              done
              ;;
            commerce)
              require commerce "$COMMERCE_RESULT"
              for result in "$PHP_RESULT" "$JS_RESULT" "$PYTHON_RESULT" "$CONTENT_RESULT" "$BUILD_RESULT" "$PRESENTATION_RESULT"; do
                allow_skipped "$result" || exit 1
              done
              ;;
            docs|reuse)
              for result in "$PHP_RESULT" "$JS_RESULT" "$PYTHON_RESULT" "$CONTENT_RESULT" "$BUILD_RESULT" "$PRESENTATION_RESULT" "$COMMERCE_RESULT"; do
                allow_skipped "$result" || exit 1
              done
              ;;
          esac

  mu-smoke:
    needs: [plan, native-lane]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a successful recognized plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          test "$PLAN_RESULT" = success
          case "$MODE" in full|presentation|commerce|docs|reuse) ;; *) exit 1 ;; esac
      - name: Record native integration scope
        run: printf 'Validation scope %s; native groups run in parallel when required.\n' "${{ needs.plan.outputs.mode }}"
      - name: Require every applicable native group
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          NATIVE_RESULT: ${{ needs.native-lane.result }}
        run: |
          case "$MODE" in
            full|commerce) test "$NATIVE_RESULT" = success ;;
            presentation|docs|reuse) case "$NATIVE_RESULT" in success|skipped) ;; *) exit 1 ;; esac ;;
          esac
