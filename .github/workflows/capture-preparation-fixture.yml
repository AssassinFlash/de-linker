name: Capture preparation fixture

on:
  push:
    branches:
      - fix/planner-fixture-witness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Export the Linux preparation fixture
        working-directory: services/engine
        run: |
          uv sync --locked
          PYTHONPATH=tests uv run --locked \
            python -m tests.planning.export_preparation_fixture
      - uses: actions/upload-artifact@v4
        with:
          name: preparation-flow-linux
          path: apps/planner/tests/fixtures/preparation-flow-linux-x86_64.json
          if-no-files-found: error
